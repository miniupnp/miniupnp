name: miniupnpc python sdist

on:
  push:
    paths:
      - "miniupnpc/**"
      - ".github/workflows/python-sdist.yml"
  pull_request:
    paths:
      - "miniupnpc/**"
      - ".github/workflows/python-sdist.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
        working-directory: miniupnpc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install from a source tree
        run: |
          python -m pip install -U pip
          python -m pip install .
          python -c "import miniupnpc; print(miniupnpc); print(miniupnpc.UPnP)"

      - name: Install from an sdist
        run: |
          python -m pip install build
          python -m build --sdist
          python -m pip install --force-reinstall dist/*.tar.gz
          python -c "import miniupnpc; print(miniupnpc); u = miniupnpc.UPnP(); print(type(u))"
