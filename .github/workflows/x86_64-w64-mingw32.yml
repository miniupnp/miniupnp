---
name: x86_64-w64-mingw32

'on':
  push:
    branches: [master]
    paths:
      - 'miniupnpc/**'
      - '.github/workflows/x86_64-w64-mingw32.yml'
  pull_request:
    branches: [master]
    paths:
      - 'miniupnpc/**'
      - '.github/workflows/x86_64-w64-mingw32.yml'

permissions:
  contents: read

# A newer run of the same pull request or branch cancels the one still running.
concurrency:
  group: x86_64-w64-mingw32-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install packages
        run: sudo apt-get install gcc-mingw-w64-x86-64 mingw-w64-tools

      - name: build miniupnpc via x86_64-w64-mingw32
        run: make -C miniupnpc -f Makefile.mingw DLLWRAP=x86_64-w64-mingw32-dllwrap CC=x86_64-w64-mingw32-gcc WINDRES=x86_64-w64-mingw32-windres AR=x86_64-w64-mingw32-ar all dist

      - name: upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: miniupnpc-win64-binaries-${{github.sha}}
          path: |
            miniupnpc/*.exe
            miniupnpc/*.dll
            miniupnpc/*.def
            miniupnpc/*.a
            miniupnpc/LICENSE
            miniupnpc/README
            miniupnpc/Changelog.txt
