        request:
          lifetime: 0
          nonce: 112233445566778899aabbcc
          protocol: UDP
          internal_port: 51001
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: "RFC 7753 \xA7\xA74.2, 4.4: exercise single-port fallback create, renewal and deletion with PORT_SET present."
