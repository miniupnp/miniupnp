        request: {natpmp: MAP_UDP, private_port: 47314, public_port: $first_port, lifetime: 300}
        expect: {version: 0, opcode: MAP_UDP_RESPONSE, result: [SUCCESS], length: 16}
        captures: {port: {offset: 10, type: u16}}
        assert: {port: {equals: $first_port}}
      cleanup:
      - protocol: natpmp
        request: {natpmp: MAP_TCP, private_port: 47314, public_port: 0, lifetime: 0}
        expect: {version: 0, opcode: MAP_TCP_RESPONSE, result: [SUCCESS], length: 16}
      - protocol: natpmp
        request: {natpmp: MAP_UDP, private_port: 47314, public_port: 0, lifetime: 0}
        expect: {version: 0, opcode: MAP_UDP_RESPONSE, result: [SUCCESS], length: 16}
    expect: {kind: lifecycle}
    description: A client which maps TCP gets the same public port on UDP; the companion port is reserved for it, not
      against it.
  # The NAT44 mappings of PCP share the external address with NAT-PMP: the same reservation (RFC 6886 §3.3)
  # keeps a port one client maps on one protocol from another client on the other protocol.
  - name: pcp-two-clients-companion-port-reserved
    protocol: pcp
    families: [ipv4]
    requires: [second-client]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 300, nonce: a3a3a3a3a3a3a3a3a3a3a3a3, protocol: TCP, internal_port: 47303,
                  external_port: 47303}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
        captures: {port: {offset: 42, type: u16}}
        assert: {port: {remember: first_port}}
      - protocol: pcp
        from: second-client
        request: {pcp: MAP, lifetime: 300, nonce: b3b3b3b3b3b3b3b3b3b3b3b3, protocol: UDP, internal_port: 47303,
                  external_port: $first_port}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
        captures: {port: {offset: 42, type: u16}}
        assert: {port: {nonzero: true, not_equals: $first_port}}
      - protocol: pcp
        from: second-client
        request: {pcp: MAP, lifetime: 300, nonce: c3c3c3c3c3c3c3c3c3c3c3c3, protocol: UDP, internal_port: 47304,
                  external_port: $first_port, options: [PREFER_FAILURE]}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [CANNOT_PROVIDE_EXTERNAL], length: 64}
      cleanup:
      - protocol: pcp
        from: second-client
        request: {pcp: MAP, lifetime: 0, nonce: c3c3c3c3c3c3c3c3c3c3c3c3, protocol: UDP, internal_port: 47304}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: a3a3a3a3a3a3a3a3a3a3a3a3, protocol: TCP, internal_port: 47303}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
      - protocol: pcp
        from: second-client
        request: {pcp: MAP, lifetime: 0, nonce: b3b3b3b3b3b3b3b3b3b3b3b3, protocol: UDP, internal_port: 47303}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
    expect: {kind: lifecycle}
    description: The first client maps TCP; the second client's UDP request for that port gets another port, and with
      PREFER_FAILURE CANNOT_PROVIDE_EXTERNAL.
  - name: pcp-same-client-maps-companion-port
    protocol: pcp
    families: [ipv4]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 300, nonce: a5a5a5a5a5a5a5a5a5a5a5a5, protocol: TCP, internal_port: 47305,
                  external_port: 47305}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
        captures: {port: {offset: 42, type: u16}}
        assert: {port: {remember: first_port}}
      - protocol: pcp
        request: {pcp: MAP, lifetime: 300, nonce: a5a5a5a5a5a5a5a5a5a5a5a5, protocol: UDP, internal_port: 47305,
                  external_port: $first_port, options: [PREFER_FAILURE]}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 64}
        captures: {port: {offset: 42, type: u16}}
        assert: {port: {equals: $first_port}}
      cleanup:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: a5a5a5a5a5a5a5a5a5a5a5a5, protocol: TCP, internal_port: 47305}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: a5a5a5a5a5a5a5a5a5a5a5a5, protocol: UDP, internal_port: 47305}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
    expect: {kind: lifecycle}
    description: A client which maps TCP gets the same external port on UDP, even with PREFER_FAILURE.
  # One external address and one reservation for both protocols of the gateway.
  - name: natpmp-holder-blocks-pcp-other-client
    protocol: pcp
    families: [ipv4]
    requires: [second-client]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: natpmp
        request: {natpmp: MAP_TCP, private_port: 47306, public_port: 47306, lifetime: 300}
        expect: {version: 0, opcode: MAP_TCP_RESPONSE, result: [SUCCESS], length: 16}
        captures: {port: {offset: 10, type: u16}}
        assert: {port: {remember: first_port}}
      - protocol: pcp
        from: second-client
        request: {pcp: MAP, lifetime: 300, nonce: b6b6b6b6b6b6b6b6b6b6b6b6, protocol: UDP, internal_port: 47306,
                  external_port: $first_port, options: [PREFER_FAILURE]}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [CANNOT_PROVIDE_EXTERNAL], length: 64}
      cleanup:
      - protocol: pcp
        from: second-client
        request: {pcp: MAP, lifetime: 0, nonce: b6b6b6b6b6b6b6b6b6b6b6b6, protocol: UDP, internal_port: 47306}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
      - protocol: natpmp
        request: {natpmp: MAP_TCP, private_port: 47306, public_port: 0, lifetime: 0}
        expect: {version: 0, opcode: MAP_TCP_RESPONSE, result: [SUCCESS], length: 16}
    expect: {kind: lifecycle}
    description: A NAT-PMP TCP mapping of one client keeps a PCP UDP request of another client off its port
      (PREFER_FAILURE gives CANNOT_PROVIDE_EXTERNAL).
- title: 'RFC 6887 PCP: Many mappings'
  description: Many PEER mappings from one client, created, updated and deleted with a bounded number of requests in flight.
  cases:
  # RFC 6887 §8.1.1: a client sends a request again when no reply arrives; the window keeps at most
  # 100 requests unanswered, the way a client with many flows would pace them.
  - name: peer-bulk-10000-update
    protocol: pcp
    families: [ipv4]
    requires: [pcp-peer, scale]      # opt-in (--scale): 40 minutes and more against a netfilter daemon
    mutating: true
    request:
      kind: pcp_bulk
      template: {pcp: PEER, protocol: UDP, peer: 198.51.100.20}
      count: 10000
      window: 100
      internal_port: {first: 30000, count: 100}    # 100 internal ports ...
      peer_port: {first: 20000}                     # ... times 100 peer ports
      nonce_prefix: b0b0b0b0b0b0b0b0
      passes:
      - {name: create, lifetime: 300}
      - {name: update, lifetime: 300, same_external_port: true}
      - {name: delete, lifetime: 0}
    expect:
      kind: bulk
      result: [SUCCESS]
    description: Create 10 000 PEER mappings, then update (refresh) all of them and delete them, with at most 100 requests
      unanswered at a time; every request is answered with SUCCESS and an update keeps the external port.
