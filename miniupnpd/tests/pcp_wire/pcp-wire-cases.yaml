- title: 'RFC 6886 NAT-PMP: Protocol behavior'
  description: Public address, mapping request validation, malformed traffic, and mutating UDP/TCP mapping lifecycles.
  cases:
  # RFC 6886 §3 (public-address request and response).
  - name: public-address
    protocol: natpmp
    families: [ipv4]
    request:
      kind: raw
      hex: '0000'
    expect:
      kind: response
      length: 12
      version: 0
      opcode: PUBLIC_ADDRESS_RESPONSE
      result: [SUCCESS, NETWORK_FAILURE]
    description: Request the NAT-PMP public address and validate its response.
    # RFC 6886 §3 (unsupported opcode result).
  - name: unsupported-opcode
    protocol: natpmp
    families: [ipv4]
    request:
      kind: raw
      hex: '0003'
    expect:
      kind: response
      length: 8
      version: 0
      opcode: 131
      result: [UNSUPP_OPCODE]
    description: Send an unknown NAT-PMP opcode and check the unsupported-opcode result.
    # RFC 6886 §3 (UDP/TCP mapping request format).
  - name: truncated-mapping
    protocol: natpmp
    families: [ipv4]
    request:
      natpmp: MAP_UDP
      private_port: 49001
      lifetime: 300
      truncate_to: 2
    expect:
      kind: silence
    description: Send only a NAT-PMP mapping opcode; the incomplete request should be ignored.
  - name: response-as-request
    protocol: natpmp
    families: [ipv4]
    request:
      natpmp: PUBLIC_ADDRESS_RESPONSE
    expect:
      kind: silence
    description: Set the response bit on a NAT-PMP packet and verify it is ignored.
    # RFC 6886 §3 (private-port validation).
  - name: zero-private-port
    protocol: natpmp
    families: [ipv4]
    request:
      natpmp: MAP_UDP
      private_port: 0
      public_port: 0
      lifetime: 3600
    expect:
      kind: response
      length: 16
      version: 0
      opcode: MAP_UDP_RESPONSE
      result: [NOT_AUTHORIZED]
    description: Request a NAT-PMP mapping with private port zero and check refusal.
    # RFC 6886 §3 (UDP mapping lifetime and renewal).
  - name: udp-mapping-lifecycle
    protocol: natpmp
    families: [ipv4]
    mutating: true
    request:
      version: 0
      opcode: 1
      response_opcode: 129
      protocol_number: 17
      reserved: 0
      internal_port_base: 43000
      port_range: 16000
      response_length: 16
      result_offset: 2
      version_offset: 0
      opcode_offset: 1
      kind: lifecycle
      operation: natpmp_mapping
      captures:
        external_port: {offset: 10, type: u16}
        granted_lifetime: {offset: 12, type: u32}
        private_port: {offset: 8, type: u16}
      steps:
      - lifetime: 3600
        public_port: $internal_port
        assert:
          external_port: {nonzero: true, remember: assigned_port}
          granted_lifetime: {min: 1, max: 3600}
          private_port: {equals: $internal_port}
        state: {line: M, mapping: present}
      - lifetime: 300
        public_port: $internal_port
        assert:
          external_port: {equals: $assigned_port}
          granted_lifetime: {equals: 300}
          private_port: {equals: $internal_port}
      - lifetime: 0
        public_port: 0
        assert:
          external_port: {equals: 0}
          granted_lifetime: {nonzero: false}
          private_port: {equals: $internal_port}
        state: {line: M, mapping: absent}
      cleanup:
        lifetime: 0
        public_port: 0
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: Create, renew, and delete a NAT-PMP UDP mapping.
    # RFC 6886 §3 (TCP mapping lifetime and renewal).
  - name: tcp-mapping-lifecycle
    protocol: natpmp
    families: [ipv4]
    mutating: true
    request:
      version: 0
      opcode: 2
      response_opcode: 130
      protocol_number: 6
      reserved: 0
      internal_port_base: 43000
      port_range: 16000
      response_length: 16
      result_offset: 2
      version_offset: 0
      opcode_offset: 1
      kind: lifecycle
      operation: natpmp_mapping
      captures:
        external_port: {offset: 10, type: u16}
        granted_lifetime: {offset: 12, type: u32}
        private_port: {offset: 8, type: u16}
      steps:
      - lifetime: 3600
        public_port: $internal_port
        assert:
          external_port: {nonzero: true, remember: assigned_port}
          granted_lifetime: {min: 1, max: 3600}
          private_port: {equals: $internal_port}
      - lifetime: 300
        public_port: $internal_port
        assert:
          external_port: {equals: $assigned_port}
          granted_lifetime: {equals: 300}
          private_port: {equals: $internal_port}
      - lifetime: 0
        public_port: 0
        assert:
          external_port: {equals: 0}
          granted_lifetime: {nonzero: false}
          private_port: {equals: $internal_port}
