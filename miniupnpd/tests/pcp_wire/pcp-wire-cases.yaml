          nonce: 112233445566778899aabbcc
          protocol: UDP
          internal_port: 51001
          external_port: 51001
          port_set: 1
      - use: map-success
        request:
          lifetime: 0
          nonce: 112233445566778899aabbcc
          protocol: UDP
          internal_port: 51001
