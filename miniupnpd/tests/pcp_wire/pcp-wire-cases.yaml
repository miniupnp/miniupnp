    families: [ipv4]
    request:
      kind: protocol_sequence
      steps:
      - protocol: natpmp
        request:
          kind: raw
          hex: '0000'
        expect:
          version: 0
          opcode: PUBLIC_ADDRESS_RESPONSE
          result: [SUCCESS]
          length: 12
        captures:
          epoch: {offset: 4, type: u32}
        assert:
          epoch: {remember: last_epoch}
      - protocol: natpmp
        request:
          kind: raw
          hex: '0000'
        expect:
          version: 0
          opcode: PUBLIC_ADDRESS_RESPONSE
          result: [SUCCESS]
          length: 12
        captures:
          epoch: {offset: 4, type: u32}
        assert:
          epoch: {remember: last_epoch, min: $last_epoch}
      - protocol: natpmp
        request:
          kind: raw
          hex: '0000'
        expect:
          version: 0
          opcode: PUBLIC_ADDRESS_RESPONSE
          result: [SUCCESS]
          length: 12
        captures:
          epoch: {offset: 4, type: u32}
        assert:
          epoch: {remember: last_epoch, min: $last_epoch}
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: "RFC 6886 \xA7\xA73.2, 3.6: repeated public-address replies use a nondecreasing epoch. This checks continuity,\
      \ not clock rate or reset behavior."
    # RFC 6886 §3.4
  - name: udp-delete-all-preserves-tcp
    protocol: natpmp
    families: [ipv4]
    request:
      kind: protocol_sequence
      steps:
      - protocol: natpmp
        request:
          natpmp: MAP_UDP
          private_port: 49071
          public_port: 49071
          lifetime: 300
        expect:
          version: 0
          opcode: MAP_UDP_RESPONSE
          result: [SUCCESS]
          length: 16
      - protocol: natpmp
        request:
          natpmp: MAP_UDP
          private_port: 49072
          public_port: 49072
          lifetime: 300
        expect:
          version: 0
          opcode: MAP_UDP_RESPONSE
          result: [SUCCESS]
          length: 16
      - protocol: natpmp
        request:
          natpmp: MAP_TCP
          private_port: 49073
          public_port: 49073
          lifetime: 300
        expect:
          version: 0
          opcode: MAP_TCP_RESPONSE
          result: [SUCCESS]
          length: 16
      - use: map-udp-success-natpmp-mapping
        request:
          private_port: 0
          public_port: 0
          lifetime: 0
      - protocol: natpmp
        request:
          natpmp: MAP_TCP
          private_port: 49073
          public_port: 49083
          lifetime: 300
        expect:
          version: 0
          opcode: MAP_TCP_RESPONSE
          result: [SUCCESS]
          length: 16
        verify: natpmp-mapping
        assert:
          external_port: {equals: 49073}
          private_port: null
          lifetime: null
      - protocol: natpmp
        request:
          natpmp: MAP_UDP
          private_port: 49071
          public_port: 49081
          lifetime: 300
        expect:
          version: 0
          opcode: MAP_UDP_RESPONSE
          result: [SUCCESS]
          length: 16
        verify: natpmp-mapping
        assert:
          external_port: {equals: 49081}
          private_port: null
          lifetime: null
      - protocol: natpmp
        request:
          natpmp: MAP_UDP
          private_port: 49072
          public_port: 49082
          lifetime: 300
        expect:
          version: 0
          opcode: MAP_UDP_RESPONSE
          result: [SUCCESS]
          length: 16
        verify: natpmp-mapping
        assert:
          external_port: {equals: 49082}
          private_port: null
          lifetime: null
      cleanup:
      - use: map-udp-success-natpmp-mapping
        request:
          private_port: 49071
          public_port: 0
          lifetime: 0
      - use: map-udp-success-natpmp-mapping
        request:
          private_port: 49072
          public_port: 0
          lifetime: 0
      - use: map-tcp-success-natpmp-mapping
        request:
          private_port: 49073
          public_port: 0
          lifetime: 0
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: "RFC 6886 \xA73.4: deleting all UDP mappings removes both UDP rules but preserves TCP; changed suggestions\
      \ distinguish retained rules from fresh allocations."
    mutating: true
    depends_on:
    - natpmp/udp-retry-changed-suggestion
    - natpmp/tcp-retry-changed-suggestion
    # RFC 6886 §3.4
  - name: udp-mapping-expires
    protocol: natpmp
    families: [ipv4]
    request:
      kind: protocol_sequence
      steps:
      - protocol: natpmp
        request:
          natpmp: MAP_UDP
          private_port: 49091
          public_port: 49091
          lifetime: 1
        expect:
          version: 0
          opcode: MAP_UDP_RESPONSE
          result: [SUCCESS]
          length: 16
      - protocol: natpmp
        request:
          natpmp: MAP_UDP
          private_port: 49091
          public_port: 49092
          lifetime: 300
        expect:
          version: 0
          opcode: MAP_UDP_RESPONSE
          result: [SUCCESS]
          length: 16
        verify: natpmp-mapping
        delay_seconds: 2.1
        assert:
          external_port: {equals: 49092}
          private_port: null
          lifetime: null
      cleanup:
      - use: map-udp-success-natpmp-mapping
        request:
          private_port: 49091
          public_port: 0
          lifetime: 0
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: "RFC 6886 \xA73.4: after a one-second lease expires, a new request can use a different public port instead\
      \ of renewing the expired rule."
    mutating: true
    depends_on:
    - natpmp/udp-short-lease-not-increased
    - natpmp/udp-retry-changed-suggestion
  # github #97: a deletion (public port 0) took the private port as the public port.
  - name: udp-delete-mapping-with-other-public-port
    protocol: natpmp
    families: [ipv4]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: natpmp
        request: {natpmp: MAP_UDP, private_port: 49051, public_port: 49151, lifetime: 300}
        expect: {version: 0, opcode: MAP_UDP_RESPONSE, result: [SUCCESS], length: 16}
        verify: natpmp-mapping
        assert:
          external_port: {equals: 49151}
      - use: map-udp-success-natpmp-mapping
        request: {private_port: 49051, public_port: 0, lifetime: 0}
      # the public port is free again: another private port gets it
      - protocol: natpmp
        request: {natpmp: MAP_UDP, private_port: 49052, public_port: 49151, lifetime: 300}
        expect: {version: 0, opcode: MAP_UDP_RESPONSE, result: [SUCCESS], length: 16}
        verify: natpmp-mapping
        assert:
          external_port: {equals: 49151}
      cleanup:
      - use: map-udp-success-natpmp-mapping
        request: {private_port: 49052, public_port: 0, lifetime: 0}
      - use: map-udp-success-natpmp-mapping
        request: {private_port: 49051, public_port: 0, lifetime: 0}
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: "RFC 6886 \xA73.4: a deletion finds the mapping by its private port; with a public port other than the\
      \ private port the mapping is removed and its public port can be used again."
- title: Lease files across a daemon restart and expiry
  description: 'The daemon records its PCP and NAT-PMP mappings in lease_file (IPv4) and lease_file6 (IPv6) and
    creates them again after a restart. The driver runs each lease-restart case in two phases,
    restarting the daemon in between: "create" makes the mappings and checks the lease file lines (and keeps them),
    "verify" checks that the same lines are back, then deletes the mappings. The lease-expiry cases need the
    short-lifetime profile (pcp_min_lifetime_override=2).'
  cases:
  # The runner reads each line of lease_file (PROTO:eport:iaddr:iport:timestamp:desc) and lease_file6
  # (PROTO;iaddr;iport;rhost;rport;uid;timestamp;desc) as a record of 15 fields, NA for one the line has not:
  #   kind|proto|eport|family|iaddr|iport|ifname|nonce|prefer_failure|since|expiry|eaddr|raddr|rport|label
  # kind comes from the description: PCP-M ("PCP MAP <nonce>"), PCP-P ("PCP PEER <nonce>"), NAT-PMP, or UPNP.
  # The cases select records by kind, family (field 3), internal port (5) and nonce. The generic lease files
  # have no FILTER peers (PCP-F), PEER mappings or DESCRIPTION labels, so selectors of those find nothing.
  # FILTER payloads: reserved 00, prefix length (96 + IPv4 prefix length for IPv4), remote port, 16-byte address.
  - name: lease-restart-ipv4
    requires: [lease-restart, pcp-peer]
    protocol: pcp
    families: [ipv4]
    mutating: true
    request:
      kind: lease_restart
      phases:
        create:
        # a filtered MAP with 2 peers (198.51.100.0/24 any port, 203.0.113.7 port 443), a refresh adding a third
        # (192.0.2.9 port 80), a PEER and a NAT-PMP mapping
        - protocol: pcp
          request: &map4
            pcp: MAP
            lifetime: 3000
            nonce: a1a2a3a4a5a6a7a8a9aaabac
            protocol: UDP
            internal_port: 43333
            external_port: 43333
            options:
            - {FILTER: 0078000000000000000000000000ffffc6336400}
            - {FILTER: 008001bb00000000000000000000ffffcb007107}
          expect: &map-ok {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: [60, 72, 84, 96, 108]}
        - protocol: pcp
          request:
            pcp: MAP
            lifetime: 3000
            nonce: a1a2a3a4a5a6a7a8a9aaabac
            protocol: UDP
            internal_port: 43333
            external_port: 43333
            options:
            - {FILTER: 0080005000000000000000000000ffffc0000209}
            - {FILTER: 0080000000000000000000000000ffffc0000309}
          expect: *map-ok
        - protocol: pcp
          request: &peer4
            pcp: PEER
            lifetime: 3000
            nonce: b1b2b3b4b5b6b7b8b9babbbc
            protocol: UDP
            internal_port: 44444
            external_port: 44444
            peer: 198.51.100.20
            peer_port: 6000
          expect: {version: 2, opcode: PEER_RESPONSE, result: [SUCCESS], length: 80}
        - protocol: natpmp
          request: &pmp4
            natpmp: MAP_UDP
            private_port: 42222
            public_port: 42222
            lifetime: 3000
          expect: &pmp-ok {version: 0, opcode: MAP_UDP_RESPONSE, result: [SUCCESS], length: 16}
        - kind: lease_file
          save: before
          lines:
          - {kind: PCP-M, family: IPv4, internal_port: 43333, count: 1}
          - {kind: PCP-F, family: IPv4, internal_port: 43333, count: 4}
          - {kind: PCP-P, internal_port: 44444, count: 1}
          - {kind: NAT-PMP, internal_port: 42222, count: 1}
        verify:
        - kind: lease_file
          same_as: before
          expiry_tolerance: 1
          lines:
          - {kind: PCP-M, family: IPv4, internal_port: 43333, count: 1}
          - {kind: PCP-F, family: IPv4, internal_port: 43333, count: 4}
          - {kind: PCP-P, internal_port: 44444, count: 1}
          - {kind: NAT-PMP, internal_port: 42222, count: 1}
      cleanup:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: a1a2a3a4a5a6a7a8a9aaabac, protocol: UDP, internal_port: 43333}
        expect: *map-ok
      - protocol: pcp
        request: {pcp: PEER, lifetime: 0, nonce: b1b2b3b4b5b6b7b8b9babbbc, protocol: UDP, internal_port: 44444,
                  peer: 198.51.100.20, peer_port: 6000}
        expect: {version: 2, opcode: PEER_RESPONSE, result: [SUCCESS], length: 80}
      - protocol: natpmp
        request: {natpmp: MAP_UDP, private_port: 42222, public_port: 0, lifetime: 0}
        expect: *pmp-ok
    expect:
      kind: lease_restart
    description: Restart the daemon with a filtered MAP (4 peers, a prefix, hosts with a port and a host with any port), a PEER and a NAT-PMP mapping; the lease file lines (nonce,
      created time, expiry, peers) must be the same afterwards.
  - name: lease-restart-ipv6
    requires: [lease-restart]
    protocol: pcp
    families: [ipv6]
    mutating: true
    request:
      kind: lease_restart
      phases:
        create:
        # an IPv6 MAP with 2 peers (2001:db8:9000::/64 any port, 2001:db8:9000::2 port 443) and a third by a
        # refresh (2001:db8:9001::9 port 80), and a MAP without peers
        - protocol: pcp
          request:
            pcp: MAP
            lifetime: 3000
            nonce: c1c2c3c4c5c6c7c8c9cacbcc
            protocol: UDP
            internal_port: 43335
            external_port: 43335
            options:
            - {FILTER: 0040000020010db8900000000000000000000000}
            - {FILTER: 008001bb20010db8900000000000000000000002}
          expect: &map6-ok {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: [60, 72, 84, 96, 108]}
        - protocol: pcp
          request:
            pcp: MAP
            lifetime: 3000
            nonce: c1c2c3c4c5c6c7c8c9cacbcc
            protocol: UDP
            internal_port: 43335
            external_port: 43335
            options:
            - {FILTER: 0080005020010db8900100000000000000000009}
            - {FILTER: 0080000020010db8900100000000000000000010}
          expect: *map6-ok
        - protocol: pcp
          request:
            pcp: MAP
            lifetime: 3000
            nonce: d1d2d3d4d5d6d7d8d9dadbdc
            protocol: UDP
            internal_port: 43336
            external_port: 43336
          expect: *map6-ok
        - kind: lease_file
          save: before
          lines:
          - {kind: PCP-M, family: IPv6, internal_port: 43335, count: 1}
          - {kind: PCP-F, family: IPv6, internal_port: 43335, count: 4}
          - {kind: PCP-M, family: IPv6, internal_port: 43336, count: 1}
        verify:
        - kind: lease_file
          same_as: before
          expiry_tolerance: 1
          lines:
          - {kind: PCP-M, family: IPv6, internal_port: 43335, count: 1}
          - {kind: PCP-F, family: IPv6, internal_port: 43335, count: 4}
          - {kind: PCP-M, family: IPv6, internal_port: 43336, count: 1}
      cleanup:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: c1c2c3c4c5c6c7c8c9cacbcc, protocol: UDP, internal_port: 43335}
        expect: *map6-ok
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: d1d2d3d4d5d6d7d8d9dadbdc, protocol: UDP, internal_port: 43336}
        expect: *map6-ok
    expect:
      kind: lease_restart
    description: Restart the daemon with an IPv6 filtered MAP (4 peers) and a MAP; the lease file lines must be the same
      afterwards.
  # A lifetime under 120 s needs pcp_min_lifetime_override; min_lifetime alone does not go under 120 s.
  - name: lease-short-lifetime-granted
    profiles: [short-lifetime]
    protocol: pcp
    families: [ipv4]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 3, nonce: '090909090909090909090909', protocol: UDP, internal_port: 43999, external_port: 43999}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
        captures: {granted_lifetime: {offset: 4, type: u32}}
        assert: {granted_lifetime: {equals: 3}}
      cleanup:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: '090909090909090909090909', protocol: UDP, internal_port: 43999}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: With pcp_min_lifetime_override=2, a lifetime of 3 s is granted as it is.
  - name: lease-min-lifetime-without-option
    profiles: [min-lifetime-only]
    protocol: pcp
    families: [ipv4]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 3, nonce: '090909090909090909090909', protocol: UDP, internal_port: 43999, external_port: 43999}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
        captures: {granted_lifetime: {offset: 4, type: u32}}
        assert: {granted_lifetime: {equals: 120}}
      cleanup:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: '090909090909090909090909', protocol: UDP, internal_port: 43999}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: min_lifetime=2 without pcp_min_lifetime_override does not go under the 120 s minimum.
  - name: lease-expiry
    profiles: [short-lifetime]
    requires: [lease-restart, pcp-peer]
    protocol: pcp
    families: [ipv4]
    mutating: true
    request:
      kind: lease_restart
      phases:
        create:
        # short lived (6 s, as the check of the file can take 3 s): MAP 43001, filtered MAP 43002, PEER 43003, NAT-PMP 43004; lasting: MAP 43005
        - protocol: pcp
          request: {pcp: MAP, lifetime: 6, nonce: '010101010101010101010101', protocol: UDP, internal_port: 43001, external_port: 43001}
          expect: &exp-ok {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: [60, 72, 84, 96, 108]}
        - protocol: pcp
          request:
            pcp: MAP
            lifetime: 6
            nonce: '020202020202020202020202'
            protocol: UDP
            internal_port: 43002
            external_port: 43002
            options:
            - {FILTER: 0078000000000000000000000000ffffc6336400}
            - {FILTER: 008001bb00000000000000000000ffffcb007107}
          expect: *exp-ok
        - protocol: pcp
          request: {pcp: PEER, lifetime: 6, nonce: '030303030303030303030303', protocol: UDP, internal_port: 43003, external_port: 43003,
                    peer: 198.51.100.20, peer_port: 6000}
          expect: {version: 2, opcode: PEER_RESPONSE, result: [SUCCESS], length: 80}
        - protocol: natpmp
          request: {natpmp: MAP_UDP, private_port: 43004, public_port: 43004, lifetime: 6}
          expect: {version: 0, opcode: MAP_UDP_RESPONSE, result: [SUCCESS], length: 16}
        - protocol: pcp
          request: {pcp: MAP, lifetime: 600, nonce: '050505050505050505050505', protocol: UDP, internal_port: 43005, external_port: 43005}
          expect: *exp-ok
        - kind: lease_file
          lines:
          - {kind: PCP-M, internal_port: 43001, count: 1}
          - {kind: PCP-M, internal_port: 43002, count: 1}
          - {kind: PCP-F, internal_port: 43002, count: 2}
          - {kind: PCP-P, internal_port: 43003, count: 1}
          - {kind: NAT-PMP, internal_port: 43004, count: 1}
          - {kind: PCP-M, internal_port: 43005, count: 1}
        verify:
        # the daemon removes the expired mappings and their lines by itself, and only theirs
        - kind: lease_file
          wait_seconds: 40
          lines:
          - {kind: PCP-M, internal_port: 43001, count: 0}
          - {kind: PCP-M, internal_port: 43002, count: 0}
          - {kind: PCP-F, internal_port: 43002, count: 0}
          - {kind: PCP-P, internal_port: 43003, count: 0}
          - {kind: NAT-PMP, internal_port: 43004, count: 0}
          - {kind: PCP-M, internal_port: 43005, count: 1}
      cleanup:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: '050505050505050505050505', protocol: UDP, internal_port: 43005}
        expect: *exp-ok
    expect:
      kind: lease_restart
    description: Short lived MAP, filtered MAP, PEER and NAT-PMP mappings leave the lease files when they expire, without
      any request; the MAP which lasts stays.
- title: Two LAN clients
  description: Mappings of one LAN client are owned by it; a second client on another LAN address (the runner's
    --second-client) cannot take over, delete or reuse them.
  cases:
  # RFC 6887 §11.3: a mapping is identified by its internal address and port; a request from another
  # internal address is a different mapping and gets another external port. The PCP cases of this
  # section are IPv4 (NAT44) only: an IPv6 PCP MAP keeps the client's own address (no translation), so two
  # clients may hold the same port number there.
  - name: pcp-two-clients-same-suggested-port
    protocol: pcp
    families: [ipv4]
    requires: [second-client]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 300, nonce: a1a1a1a1a1a1a1a1a1a1a1a1, protocol: UDP, internal_port: 47301,
                  external_port: 47301}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
        captures: {port: {offset: 42, type: u16}}
        assert: {port: {remember: first_port}}
      - protocol: pcp
        from: second-client
        request: {pcp: MAP, lifetime: 300, nonce: b1b1b1b1b1b1b1b1b1b1b1b1, protocol: UDP, internal_port: 47301,
                  external_port: $first_port}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
        captures: {port: {offset: 42, type: u16}}
        assert: {port: {nonzero: true, not_equals: $first_port}}
      cleanup:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: a1a1a1a1a1a1a1a1a1a1a1a1, protocol: UDP, internal_port: 47301}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
      - protocol: pcp
        from: second-client
        request: {pcp: MAP, lifetime: 0, nonce: b1b1b1b1b1b1b1b1b1b1b1b1, protocol: UDP, internal_port: 47301}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
    expect: {kind: lifecycle}
    description: The second client asks for the external port the first client holds; it gets a mapping on another
      external port.
  # RFC 6887 §11.3 / §15: only the client which owns a mapping (its internal address and nonce) can delete
  # it; the delete of the second client concerns its own (absent) mapping.
  - name: pcp-two-clients-delete-is-isolated
    protocol: pcp
    families: [ipv4]
    requires: [second-client]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 300, nonce: a2a2a2a2a2a2a2a2a2a2a2a2, protocol: UDP, internal_port: 47302,
                  external_port: 47302}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
        captures: {port: {offset: 42, type: u16}}
        assert: {port: {remember: first_port}}
      - protocol: pcp
        from: second-client
        request: {pcp: MAP, lifetime: 0, nonce: a2a2a2a2a2a2a2a2a2a2a2a2, protocol: UDP, internal_port: 47302}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS, NOT_AUTHORIZED], length: 60}
      # the first client's mapping still holds the port: the second client cannot have it
      - protocol: pcp
        from: second-client
        request: {pcp: MAP, lifetime: 300, nonce: b2b2b2b2b2b2b2b2b2b2b2b2, protocol: UDP, internal_port: 47302,
                  external_port: $first_port, options: [PREFER_FAILURE]}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [CANNOT_PROVIDE_EXTERNAL], length: 64}
      cleanup:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: a2a2a2a2a2a2a2a2a2a2a2a2, protocol: UDP, internal_port: 47302}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
      - protocol: pcp
        from: second-client
        request: {pcp: MAP, lifetime: 0, nonce: b2b2b2b2b2b2b2b2b2b2b2b2, protocol: UDP, internal_port: 47302}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
    expect: {kind: lifecycle}
    description: A delete from the second client with the first client's nonce and internal port leaves the first
      client's mapping; its external port is still taken.
  # RFC 6886 §3.3: a mapping of one client is not given to another client with another internal address.
  - name: natpmp-two-clients-same-public-port
    protocol: natpmp
    families: [ipv4]
    requires: [second-client]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: natpmp
        request: {natpmp: MAP_UDP, private_port: 47311, public_port: 47311, lifetime: 300}
        expect: {version: 0, opcode: MAP_UDP_RESPONSE, result: [SUCCESS], length: 16}
        captures: {port: {offset: 10, type: u16}}
        assert: {port: {remember: first_port}}
      - protocol: natpmp
        from: second-client
        request: {natpmp: MAP_UDP, private_port: 47311, public_port: $first_port, lifetime: 300}
        expect: {version: 0, opcode: MAP_UDP_RESPONSE, result: [SUCCESS], length: 16}
        captures: {port: {offset: 10, type: u16}}
        assert: {port: {nonzero: true, not_equals: $first_port}}
      cleanup:
      - protocol: natpmp
        request: {natpmp: MAP_UDP, private_port: 47311, public_port: 0, lifetime: 0}
        expect: {version: 0, opcode: MAP_UDP_RESPONSE, result: [SUCCESS], length: 16}
      - protocol: natpmp
        from: second-client
        request: {natpmp: MAP_UDP, private_port: 47311, public_port: 0, lifetime: 0}
        expect: {version: 0, opcode: MAP_UDP_RESPONSE, result: [SUCCESS], length: 16}
    expect: {kind: lifecycle}
    description: The second client asks for the public port the first client holds; it gets another public port.
  # RFC 6886 §3.4: a delete-all request removes the mappings of the requesting client only.
  - name: natpmp-two-clients-delete-all-isolated
    protocol: natpmp
    families: [ipv4]
    requires: [second-client]
    mutating: true
    request:
