    description: "RFC 6887 \xA78.2: preserve unknown opcode payload bytes in error responses."
  - name: long-error-lifetime-default
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      pcp: MAP
      lifetime: 0
      nonce: 112233445566778899aabbcc
      protocol: UDP
      internal_port: 50001
      external_port: 50001
      options:
      - {code: 127}
    expect:
      kind: response
      version: 2
      opcode: MAP_RESPONSE
      result: [UNSUPP_OPTION]
      length: 64
      fields:
      - {offset: 4, type: u32, equals: 1800, description: long error lifetime}
    description: "RFC 6887 \xA77.4: long-lived errors SHOULD default to a 30-minute error lifetime."
  # RFC 7753 section 4.3: omission of PORT_SET never proves lack of support.
  # The baseline fixture leaves option 130 unprocessed; allocator profiles must
  # be selected explicitly. miniupnpd currently does not process option 130.
  # RFC 7753 section 4: the baseline fixture ignores unprocessed option
  # contents and omits PORT_SET in successful single-port responses.
  # This checks fallback behavior, not lack of server capability (4.3).
- title: 'RFC 7652 PCP: Authentication extension profile'
  description: PA-Initiation and EAP exchange support. The daemon does not implement this optional authentication profile;
    the probe is recorded as an expected failure.
  cases:
  # RFC 7652 §5.1 (AUTHENTICATION_TAG option).
  - name: auth-extension-unsupported
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      pcp: MAP
      lifetime: 3600
      client: unspecified
      nonce: '424242424242424242424242'
      protocol: UDP
      internal_port: 40000
      options:
      - {code: 5, data_hex: '00000000'}
    expect:
      kind: response
      length: request
      version: 2
      opcode: MAP_RESPONSE
      result: [UNSUPP_OPTION]
    description: Send the RFC 7652 AUTHENTICATION_TAG option without an established PA session.
    # RFC 7652 §3.1.1 excerpt: “The PA-Client message MUST also contain a NONCE option”.
  - name: auth-initiation-unsupported
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      pcp: AUTHENTICATION
      result_code: 14
      session_id: 0
      sequence_number: 0
      options:
      - {NONCE: '12345678'}
    expect:
      kind: response
      length: 40
      version: 2
      opcode: AUTHENTICATION_RESPONSE
      result: [UNSUPP_OPCODE]
    description: Send a valid RFC 7652 PA-Initiation with a NONCE; baseline daemon rejects the AUTHENTICATION opcode.
    # RFC 7652 §3.1.1 requires zero in the PA-Initiation Sequence Number field.
  - name: rfc7652-initiation-supported
    protocol: pcp
    families: [ipv4, ipv6]
    known_failure: The optional RFC 7652 authentication profile is not implemented by miniupnpd.
    request:
      pcp: AUTHENTICATION
      result_code: 14
      session_id: 0
      sequence_number: 0
      options:
      - {NONCE: '12345678'}
    expect:
      kind: response
      min_length: 48
      version: 2
      opcode: AUTHENTICATION_RESPONSE
      result: [22]
      fields:
      - offset: 24
        type: u32
        nonzero: true
        description: assigned PA session ID
      - offset: 28
        type: u32
        equals: 0
        description: initial server sequence number
      required_options:
      - {code: 4, data_hex: '12345678'}
      - {code: 7, minimum_length: 4}
      options_offset: 32
    description: Probe optional RFC 7652 support by expecting AUTHENTICATION_REQUEST with a fresh session ID, echoed NONCE,
      and EAP request; currently an expected failure because miniupnpd rejects AUTHENTICATION.
    # RFC 7652 §5.3 defines the NONCE as a random 32-bit value echoed by the server.
  - name: auth-initiation-invalid-sequence
    protocol: pcp
    depends_on: [pcp/rfc7652-initiation-supported]
    families: [ipv4, ipv6]
    request:
      pcp: AUTHENTICATION
      result_code: 14
      session_id: 0
      sequence_number: 1
      options:
      - {NONCE: '12345678'}
    expect:
      kind: silence
    description: Send PA-Initiation with a nonzero sequence number; the server must discard this invalid initiation.
  - name: auth-sequence-valid-next
    protocol: pcp
    depends_on: [pcp/rfc7652-initiation-supported]
    families: [ipv4, ipv6]
    request:
      kind: pcp_auth_sequence
      initiation:
        kind: pcp_auth
        opcode: 3
        result_code: 14
        session_id: 0
        sequence_number: 0
        options:
        - {code: 4, data_hex: '12345678'}
    expect:
      kind: auth_sequence
      initiation_result: 22
      initial_server_sequence: 0
      followup:
        sequence_number: 1
        identity: harness-user
        behavior: response
        result_codes: [16, 17, 18, 22]
        response_sequence: 1
    description: Complete PA-Initiation, then send the next valid client sequence number and check that the server advances
      its sequence.
    # RFC 7652 §§3.1.1, 6.4: PA-Initiation starts at zero; each accepted PA message advances the sequence by one.
  - name: auth-sequence-large-jump
    protocol: pcp
    depends_on: [pcp/rfc7652-initiation-supported]
    families: [ipv4, ipv6]
    request:
      kind: pcp_auth_sequence
      initiation:
        kind: pcp_auth
        opcode: 3
        result_code: 14
        session_id: 0
        sequence_number: 0
        options:
        - {code: 4, data_hex: '12345678'}
    expect:
      kind: auth_sequence
      initiation_result: 22
      initial_server_sequence: 0
      followup:
        sequence_number: 2147483647
        identity: harness-user
        behavior: discard
    description: Establish a PA session and send a large jump instead of the next expected client sequence; no new server
      message may be produced.
    # RFC 7652 §6.4: a PA message with a sequence number other than the expected value is not accepted.
  - name: auth-sequence-replay-modified
    protocol: pcp
    depends_on: [pcp/rfc7652-initiation-supported]
    families: [ipv4, ipv6]
    request:
      kind: pcp_auth_sequence
      initiation:
        kind: pcp_auth
        opcode: 3
        result_code: 14
        session_id: 0
        sequence_number: 0
        options:
        - {code: 4, data_hex: '12345678'}
    expect:
      kind: auth_sequence
      initiation_result: 22
      initial_server_sequence: 0
      followup:
        sequence_number: 1
        identity: harness-user
        behavior: response
        result_codes: [16, 17, 18, 22]
        response_sequence: 1
      replay: {sequence_number: 1, identity: modified-replay}
    description: After accepting sequence 1, resend sequence 1 with different EAP data; the server must discard the modified
      replay.
    # RFC 7652 §6.3: a same-sequence duplicate that differs bit-for-bit from the original is discarded.
    # RFC 7652 §§3.1.1, 5.3 (PA-Client EAP response and session state).
  - name: auth-eap-reply-unsupported
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      pcp: AUTHENTICATION
      result_code: 23
      session_id: 305419896
      sequence_number: 0
      options:
      - {code: 7, data_hex: '0201000501'}
    expect:
      kind: response
      length: 44
      version: 2
      opcode: AUTHENTICATION_RESPONSE
      result: [UNSUPP_OPCODE]
    description: Send an RFC 7652 EAP response PA-Client message without an established session.
    # RFC 7652 §3.1.1 (AUTHENTICATION_REQUEST, PA-Server response, session ID, and NONCE echo).
  - name: rfc7652-nonce-zero-echo
    protocol: pcp
    depends_on: [pcp/rfc7652-initiation-supported]
    families: [ipv4, ipv6]
    request:
      pcp: AUTHENTICATION
      result_code: 14
      session_id: 0
      sequence_number: 0
      options:
      - {NONCE: '00000000'}
    expect:
      kind: response
      min_length: 48
      version: 2
      opcode: AUTHENTICATION_RESPONSE
      result: [22]
      fields:
      - offset: 24
        type: u32
        nonzero: true
        description: assigned PA session ID
      - offset: 28
        type: u32
        equals: 0
        description: initial server sequence number
      required_options:
      - {code: 4, data_hex: '00000000'}
      - {code: 7, minimum_length: 4}
      options_offset: 32
    description: Check exact echo of a zero-valued 32-bit authentication NONCE test pattern.
  - name: rfc7652-nonce-all-ones-echo
    protocol: pcp
    depends_on: [pcp/rfc7652-initiation-supported]
    families: [ipv4, ipv6]
    request:
      pcp: AUTHENTICATION
      result_code: 14
      session_id: 0
      sequence_number: 0
      options:
      - {NONCE: ffffffff}
    expect:
      kind: response
      min_length: 48
      version: 2
      opcode: AUTHENTICATION_RESPONSE
      result: [22]
      fields:
      - offset: 24
        type: u32
        nonzero: true
        description: assigned PA session ID
      - offset: 28
        type: u32
        equals: 0
        description: initial server sequence number
      required_options:
      - {code: 4, data_hex: ffffffff}
      - {code: 7, minimum_length: 4}
      options_offset: 32
    description: Check exact echo and unsigned handling of an all-ones authentication NONCE.
  - name: rfc7652-nonce-high-low-bits-echo
    protocol: pcp
    depends_on: [pcp/rfc7652-initiation-supported]
    families: [ipv4, ipv6]
    request:
      pcp: AUTHENTICATION
      result_code: 14
      session_id: 0
      sequence_number: 0
      options:
      - {NONCE: '80000001'}
    expect:
      kind: response
      min_length: 48
      version: 2
      opcode: AUTHENTICATION_RESPONSE
      result: [22]
      fields:
      - offset: 24
        type: u32
        nonzero: true
        description: assigned PA session ID
      - offset: 28
        type: u32
        equals: 0
        description: initial server sequence number
      required_options:
      - {code: 4, data_hex: '80000001'}
      - {code: 7, minimum_length: 4}
      options_offset: 32
    description: Check exact echo when both the high and low bits of the 32-bit authentication NONCE are set.
    # RFC 7652 §7.1 limits NONCE to one occurrence with a four-octet value.
  - name: rfc7652-nonce-duplicate
    protocol: pcp
    depends_on: [pcp/rfc7652-initiation-supported]
    families: [ipv4, ipv6]
    request:
      pcp: AUTHENTICATION
      result_code: 14
      session_id: 0
      sequence_number: 0
      options:
      - {NONCE: '12345678'}
      - {NONCE: '87654321'}
    expect:
      kind: response
      length: request
      version: 2
      opcode: AUTHENTICATION_RESPONSE
      result: [MALFORMED_OPTION]
    description: Send two NONCE options; the option definition permits only one and expects MALFORMED_OPTION.
  - name: rfc7652-nonce-short
    protocol: pcp
    depends_on: [pcp/rfc7652-initiation-supported]
    families: [ipv4, ipv6]
    request:
