        expect: {version: 0, opcode: MAP_UDP_RESPONSE, result: [SUCCESS], length: 16}
    expect: {kind: lifecycle}
    description: A UDP delete-all of the second client leaves the first client's UDP mapping; its public port is still
      taken.
  # RFC 6886 §3.3: "the NAT gateway MUST reserve the companion port so the same client can choose to map it
  # in the future" ... "another client with a different internal IP address MUST NOT be able to successfully
  # acquire the mapping for UDP port 80".
  - name: natpmp-two-clients-companion-port-reserved
    protocol: natpmp
    families: [ipv4]
    requires: [second-client]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: natpmp
        request: {natpmp: MAP_TCP, private_port: 47313, public_port: 47313, lifetime: 300}
        expect: {version: 0, opcode: MAP_TCP_RESPONSE, result: [SUCCESS], length: 16}
        captures: {port: {offset: 10, type: u16}}
        assert: {port: {remember: first_port}}
      - protocol: natpmp
        from: second-client
        request: {natpmp: MAP_UDP, private_port: 47313, public_port: $first_port, lifetime: 300}
        expect: {version: 0, opcode: MAP_UDP_RESPONSE, result: [SUCCESS], length: 16}
        captures: {port: {offset: 10, type: u16}}
        assert: {port: {nonzero: true, not_equals: $first_port}}
      cleanup:
      - protocol: natpmp
        request: {natpmp: MAP_TCP, private_port: 47313, public_port: 0, lifetime: 0}
        expect: {version: 0, opcode: MAP_TCP_RESPONSE, result: [SUCCESS], length: 16}
      - protocol: natpmp
        from: second-client
        request: {natpmp: MAP_UDP, private_port: 47313, public_port: 0, lifetime: 0}
        expect: {version: 0, opcode: MAP_UDP_RESPONSE, result: [SUCCESS], length: 16}
    expect: {kind: lifecycle}
    description: The first client maps TCP; the second client asks for the same port on UDP and gets another one, as
      the companion UDP port stays reserved for the first client.
  # RFC 6886 §3.3: the companion port is reserved "so the same client can choose to map it in the future".
  - name: natpmp-same-client-maps-companion-port
    protocol: natpmp
    families: [ipv4]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: natpmp
        request: {natpmp: MAP_TCP, private_port: 47314, public_port: 47314, lifetime: 300}
        expect: {version: 0, opcode: MAP_TCP_RESPONSE, result: [SUCCESS], length: 16}
        captures: {port: {offset: 10, type: u16}}
        assert: {port: {remember: first_port}}
