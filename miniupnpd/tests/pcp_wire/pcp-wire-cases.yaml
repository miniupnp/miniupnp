      version: 2
      opcode: AUTHENTICATION_RESPONSE
      result: [MALFORMED_OPTION]
    description: Send a five-octet authentication NONCE; expect MALFORMED_OPTION.
  - name: rfc7652-nonce-reserved-bits
    protocol: pcp
    depends_on: [pcp/rfc7652-initiation-supported]
    families: [ipv4, ipv6]
    request:
      pcp: AUTHENTICATION
      result_code: 14
      session_id: 0
      sequence_number: 0
      options:
      - {code: 4, raw_hex: 04ff000412345678}
    expect:
      kind: response
      min_length: 48
      version: 2
      opcode: AUTHENTICATION_RESPONSE
      result: [22]
      fields:
      - offset: 24
        type: u32
        nonzero: true
        description: assigned PA session ID
      - offset: 28
        type: u32
        equals: 0
        description: initial server sequence number
      required_options:
      - {code: 4, data_hex: '12345678'}
      - {code: 7, minimum_length: 4}
      options_offset: 32
    description: Set the NONCE option reserved byte on reception; RFC 7652 says receivers ignore it.
    # RFC 7652 §5.3: the NONCE reserved bits are ignored on reception.
- title: 'RFC 7753 PCP Extension for Port-Set Allocation: Fallback and framing'
  description: IPv4/IPv6 single-port fallback for unprocessed option 130, with TCP/UDP lifecycle and common framing checks.
  cases:
  # RFC 7753 sections 4, 4.2-4.4 and 6.3; see the case description for the specific assertion.
  - name: port-set-single-port-fallback-size-2-flags-0
    known_failure: miniupnpd echoes unprocessed optional options in replies; response option omission is not implemented.
    protocol: pcp
    families: [ipv4, ipv6]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - use: map-success-checked
        request:
          lifetime: 300
          nonce: 112233445566778899aabbcc
          protocol: UDP
          internal_port: 51001
          external_port: 51001
          port_set: 2
      cleanup:
      - use: map-success
        request:
          lifetime: 0
          nonce: 112233445566778899aabbcc
          protocol: UDP
          internal_port: 51001
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: "RFC 7753 \xA7\xA74.2\u20134.3: in the current single-port fallback profile, accept the MAP and omit PORT_SET;\
      \ do not infer lack of support from omission or require optional parity preservation."
    profiles:
    - baseline
  # RFC 7753 sections 4, 4.2-4.4 and 6.3; see the case description for the specific assertion.
