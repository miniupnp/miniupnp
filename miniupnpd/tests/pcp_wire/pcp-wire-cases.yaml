    description: Send a three-octet authentication NONCE; expect MALFORMED_OPTION.
  - name: rfc7652-nonce-long
    protocol: pcp
    depends_on: [pcp/rfc7652-initiation-supported]
    families: [ipv4, ipv6]
    request:
      pcp: AUTHENTICATION
