    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: "RFC 6887 \xA711.3: the TCP form of the #926 case; a client that restarts and reuses its nonce asks\
      \ again with suggested port 0 and must get the internal port back."
  # github #748: the nonce was not checked when an IPv6 mapping was renewed.
  - name: map-ipv6-renew-wrong-nonce
    protocol: pcp
    families: [ipv6]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 300, nonce: '748748748748748748748748', protocol: UDP, internal_port: 50152,
                  external_port: 50152}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
      - protocol: pcp
        request: {pcp: MAP, lifetime: 600, nonce: '0bad0bad0bad0bad0bad0bad', protocol: UDP, internal_port: 50152,
                  external_port: 50152}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [NOT_AUTHORIZED], length: 60}
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: '0bad0bad0bad0bad0bad0bad', protocol: UDP, internal_port: 50152}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [NOT_AUTHORIZED], length: 60}
      - protocol: pcp
        request: {pcp: MAP, lifetime: 300, nonce: '748748748748748748748748', protocol: UDP, internal_port: 50152,
                  external_port: 50152}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
        captures: {port: {offset: 42, type: u16}}
        assert: {port: {equals: 50152}}
      cleanup:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: '748748748748748748748748', protocol: UDP, internal_port: 50152}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: '0bad0bad0bad0bad0bad0bad', protocol: UDP, internal_port: 50152}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS, NOT_AUTHORIZED], length: 60}
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: "RFC 6887 \xA711.2: another nonce may neither renew nor delete an IPv6 mapping (NOT_AUTHORIZED), and the\
      \ owner's nonce still renews it afterwards."
  # github #131, #747: a renewal must move the expiry (pf answered NO_RESOURCES and kept the old one).
  # The profile runs are IPv4 only (run_profile in run-docker.sh and freebsd/lease-suite.sh).
  - name: map-renewal-extends-expiry
    profiles: [short-lifetime]
    protocol: pcp
    families: [ipv4]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 6, nonce: '131131131131131131131131', protocol: UDP, internal_port: 50153,
                  external_port: 50153}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
        captures: {granted_lifetime: {offset: 4, type: u32}}
        assert: {granted_lifetime: {equals: 6}}
      - protocol: pcp
        delay_seconds: 3
        request: {pcp: MAP, lifetime: 6, nonce: '131131131131131131131131', protocol: UDP, internal_port: 50153,
                  external_port: 50153}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
        captures: {granted_lifetime: {offset: 4, type: u32}}
        assert: {granted_lifetime: {equals: 6}}
      # 7.5 s after the create: past the first expiry (6 s), before the renewed one (9 s). The mapping
      # still has an owner, so another nonce is refused.
      - protocol: pcp
        delay_seconds: 4.5
        request: {pcp: MAP, lifetime: 6, nonce: '0bad0bad0bad0bad0bad0bad', protocol: UDP, internal_port: 50153,
                  external_port: 50153}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [NOT_AUTHORIZED], length: 60}
      cleanup:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: '131131131131131131131131', protocol: UDP, internal_port: 50153}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: '0bad0bad0bad0bad0bad0bad', protocol: UDP, internal_port: 50153}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS, NOT_AUTHORIZED], length: 60}
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: "RFC 6887 \xA711.2.1: a renewal with the same nonce extends the mapping; after the first lifetime has\
      \ passed the mapping is still there and still refuses another nonce."
  # github #69: the all-zeros IPv4 address (::ffff:0.0.0.0) was taken as a mismatching external address.
  - name: map-suggested-external-ipv4-all-zeros
    protocol: pcp
    families: [ipv4]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 300, nonce: '069069069069069069069069', protocol: UDP, internal_port: 50154,
                  external_port: 50154, external_address: '::ffff:0.0.0.0'}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
        captures: {port: {offset: 42, type: u16}}
        assert: {port: {nonzero: true}}
      cleanup:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: '069069069069069069069069', protocol: UDP, internal_port: 50154}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: "RFC 6887 \xA75, \xA711.1: ::ffff:0.0.0.0 in the suggested external address means no preference for an\
      \ IPv4 address, so the MAP succeeds."
  - name: map-suggested-external-ipv4-all-zeros-prefer-failure
    protocol: pcp
    families: [ipv4]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 300, nonce: '069069069069069069069070', protocol: UDP, internal_port: 50155,
                  external_port: 50155, external_address: '::ffff:0.0.0.0', options: [PREFER_FAILURE]}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: [60, 64]}
        captures: {port: {offset: 42, type: u16}}
        assert: {port: {equals: 50155}}
      cleanup:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: '069069069069069069069070', protocol: UDP, internal_port: 50155}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: "RFC 6887 \xA713.2: with PREFER_FAILURE, an all-zeros suggested address is not a mismatch; only the free\
      \ suggested port binds the server."
  # github #924: UDP-Lite (RFC 3828, IP protocol 136). The iptables backend uses a udp match for it on IPv4 (the
  # commit fails) and on IPv6 writes a udplite rule that ip6tables cannot list or save. Linux 7.1 removed UDP-Lite
  # (the IPv4 and IPv6 sockets; deprecated since 2023), which favours refusing it with UNSUPP_PROTOCOL there.
  - name: map-udplite-lifecycle
    protocol: pcp
    families: [ipv4, ipv6]
    mutating: true
    known_failure: "miniupnpd does not support UDP-Lite (RFC 3828, protocol 136) mappings on every firewall backend\
      \ (#924)."
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 300, nonce: '924924924924924924924924', protocol: 136, internal_port: 50156,
                  external_port: 50156}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
        captures: {port: {offset: 42, type: u16}, protocol_number: {offset: 36, type: u8}}
        assert: {port: {nonzero: true, remember: assigned}, protocol_number: {equals: 136}}
      - protocol: pcp
        request: {pcp: MAP, lifetime: 300, nonce: '924924924924924924924924', protocol: 136, internal_port: 50156}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
        captures: {port: {offset: 42, type: u16}}
        assert: {port: {equals: $assigned}}
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: '924924924924924924924924', protocol: 136, internal_port: 50156}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
      cleanup:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: '924924924924924924924924', protocol: 136, internal_port: 50156}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: "RFC 3828, RFC 6887 \xA711.1: a MAP for UDP-Lite (protocol 136) is created, renewed with the same external\
      \ port and deleted."
