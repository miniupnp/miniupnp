    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: Create and remove four mappings while checking zero, all-one, alternating-byte, and boundary-bit nonce echoes.
      Zero and all-one values are wire test patterns, not client randomness guidance.
    # RFC 6887 §§11.2–11.3: a nonce identifies the explicit mapping for refresh validation.
  - name: map-v2-nonce-mismatch-refresh
    protocol: pcp
    families: [ipv4]
    mutating: true
    request:
      version: 2
      opcode: 1
      response_opcode: 129
      protocol_number: 17
      internal_port_base: 44000
      port_range: 10000
      response_length: 60
      nonce_length: 12
      nonce_hex: 00112233445566778899aabb
      nonce_offset: 24
      version_offset: 0
      opcode_offset: 1
      result_offset: 3
      kind: lifecycle
      operation: pcp_map
      captures:
        external_port: {offset: 42, type: u16}
        granted_lifetime: {offset: 4, type: u32}
      steps:
      - lifetime: 300
        external_port: 0
        assert:
          external_port: {nonzero: true, remember: assigned_port}
          granted_lifetime: {min: 120, max: 300}
      - lifetime: 300
        external_port: $assigned_port
        nonce_hex: ffeeddccbbaa998877665544
        result: [2]
        assert:
          external_port: {equals: $assigned_port}
          granted_lifetime: {min: 1, max: 300}
      - lifetime: 300
        external_port: $assigned_port
        assert:
          external_port: {equals: $assigned_port}
          granted_lifetime: {min: 120, max: 300}
      cleanup:
      - lifetime: 0
        external_port: 0
      - lifetime: 0
        external_port: 0
        nonce_hex: ffeeddccbbaa998877665544
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: Create a mapping, attempt to refresh it with another nonce, then prove the original nonce still controls
      it and clean it up.
  - name: map-v2-nonce-identical-retry
    protocol: pcp
    families: [ipv4]
    mutating: true
    request:
      version: 2
      opcode: 1
      response_opcode: 129
      protocol_number: 17
      internal_port_base: 45000
      port_range: 10000
      response_length: 60
      nonce_length: 12
      nonce_hex: a55aa55aa55aa55aa55aa55a
      nonce_offset: 24
      version_offset: 0
      opcode_offset: 1
      result_offset: 3
      kind: lifecycle
      operation: pcp_map
      captures:
        external_port: {offset: 42, type: u16}
        granted_lifetime: {offset: 4, type: u32}
      steps:
      - lifetime: 300
        external_port: 0
        assert:
          external_port: {nonzero: true, remember: assigned_port}
      - lifetime: 300
        external_port: 0
        assert:
          external_port: {equals: $assigned_port}
      cleanup:
        lifetime: 0
        external_port: $assigned_port
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: Retry a create request with the same key and nonce, and require the existing external port to be reused.
    # RFC 6887 §§11.2–11.3: refresh an existing mapping using its original nonce.
    # RFC 6887 §11.2 (PEER mapping lifecycle).
  - name: peer-v2-lifecycle
    requires: [pcp-peer]
    protocol: pcp
    families: [ipv4]
    mutating: true
    request:
      version: 2
      opcode: 2
      response_opcode: 130
      protocol_number: 17
      peer_address: 192.0.2.99
      peer_port: 443
      internal_port_base: 42000
      port_range: 18000
      response_length: 80
      nonce_length: 12
      nonce_offset: 24
      version_offset: 0
      opcode_offset: 1
      result_offset: 3
      kind: lifecycle
      operation: pcp_peer
      captures:
        external_port: {offset: 42, type: u16}
        granted_lifetime: {offset: 4, type: u32}
      steps:
      - lifetime: 3600
        external_port: 0
        assert:
          external_port: {nonzero: true, remember: assigned_port}
        state: {line: P, mapping: present}
      - lifetime: 0
        external_port: $assigned_port
        assert:
          external_port: {equals: $assigned_port}
        state: {line: P, mapping: absent}
      cleanup:
        lifetime: 0
        external_port: $assigned_port
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: Create and delete a PCP v2 PEER mapping for the configured remote peer.
  # Regression cases from GitHub issues (issue number in the comment above each case).
  # github #926: a renewed IPv6 mapping was answered with external port 0.
  - name: map-ipv6-renew-zero-suggestion-udp
    protocol: pcp
    families: [ipv6]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 300, nonce: '926926926926926926926926', protocol: UDP, internal_port: 50150}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
        captures: {port: {offset: 42, type: u16}}
        assert: {port: {equals: 50150}}
      - protocol: pcp
        request: {pcp: MAP, lifetime: 300, nonce: '926926926926926926926926', protocol: UDP, internal_port: 50150}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
        captures: {port: {offset: 42, type: u16}}
        assert: {port: {equals: 50150}}
      - protocol: pcp
        request: {pcp: MAP, lifetime: 300, nonce: '926926926926926926926926', protocol: UDP, internal_port: 50150,
                  external_port: 50999}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
        captures: {port: {offset: 42, type: u16}}
        assert: {port: {equals: 50150}}
      cleanup:
      - protocol: pcp
        request: {pcp: MAP, lifetime: 0, nonce: '926926926926926926926926', protocol: UDP, internal_port: 50150}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: "RFC 6887 \xA711.3: a renewal of an IPv6 mapping, with a zero or a changed suggested port, returns the\
      \ existing external port (the internal port), not 0 or the suggestion."
  - name: map-ipv6-renew-zero-suggestion-tcp
    protocol: pcp
