  # RFC 7753 sections 4, 4.2-4.4 and 6.3; see the case description for the specific assertion.
  # RFC 7753 section 4.4: verify fresh ownership after whole-set expiry.
  # Wait for the granted lifetime plus one second, not the requested lease.
  # With a 120-second minimum, the full allocator suite can take many minutes.
  - name: port-set-expiry-tcp
    protocol: pcp
    profiles:
    - port-set
    families: [ipv4, ipv6]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request:
          pcp: MAP
          lifetime: 2
          nonce: 112233445566778899aabbcc
          protocol: TCP
          internal_port: 51001
          port_set: 4
        expect:
          version: 2
          opcode: MAP_RESPONSE
          result: [SUCCESS]
          length: 72
        verify: port-set-mapping
        assert:
          external: {nonzero: true, max: 65532}
          lifetime: {min: 1, max: 120, remember: ttl}
      - use: map-not-authorized-echo
        request:
          lifetime: 300
          nonce: ffeeddccbbaa998877665544
          protocol: TCP
          port_set: 1
        each:
        - request: {internal_port: 51002}
        - request: {internal_port: 51003}
        - request: {internal_port: 51004}
      - protocol: pcp
        request:
          pcp: MAP
          lifetime: 300
          nonce: ffeeddccbbaa998877665544
          protocol: TCP
          internal_port: 51001
          port_set: 1
        expect:
          version: 2
          opcode: MAP_RESPONSE
          result: [SUCCESS]
          length: 60
        verify: mapping
        delay_seconds: {add: [$ttl, 1]}
        assert:
          external: {nonzero: true, max: 65535}
      - use: map-success-mapping-checked
        request:
          lifetime: 300
          nonce: ffeeddccbbaa998877665544
          protocol: TCP
          port_set: 1
        each:
        - request: {internal_port: 51002}
        - request: {internal_port: 51003}
        - request: {internal_port: 51004}
      cleanup: auto
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: 'RFC 7753 section 4.4: the short-lease fixture expires the whole set; every member accepts a fresh owner
      after its lifetime.'
