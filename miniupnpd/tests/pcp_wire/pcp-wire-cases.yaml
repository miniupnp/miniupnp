version: 1
profiles:
  baseline:
    description: Single-port fallback. PORT_SET payload semantics are not processed; invalid envelopes still fail.
  port-set:
    description: 'Explicit allocator fixture: fully grant sets through 16 ports, honor 120/300 second renewals and grant short
      requests at most 120 seconds, no quota exhaustion; IPv4/IPv6 TCP/UDP.'
  port-set-limited:
    description: 'Explicit allocator fixture: cap each new set at two ports and each client at four ports, with spare global
      resources and 120/300 second renewals; IPv4/IPv6 TCP/UDP.'
  short-lifetime:
    description: 'Daemon fixture with pcp_min_lifetime_override=2, so a PCP lifetime of a few seconds is granted.'
  min-lifetime-only:
    description: 'Daemon fixture with min_lifetime=2 and without pcp_min_lifetime_override: the minimum stays 120 s.'
defs:
  steps:
    map-success-mapping:
      protocol: pcp
      expect:
        version: 2
        opcode: MAP_RESPONSE
        result: [SUCCESS]
        length: [60, 72]
      verify: mapping
      request:
        pcp: MAP
    map-success-mapping-checked:
      protocol: pcp
      expect:
        version: 2
        opcode: MAP_RESPONSE
        result: [SUCCESS]
        length: 60
      verify: mapping
      assert:
        external: {nonzero: true, max: 65535}
      request:
        pcp: MAP
    map-not-authorized-echo:
      protocol: pcp
      expect:
        version: 2
        opcode: MAP_RESPONSE
        result: [NOT_AUTHORIZED]
        length: 72
        echo_request: [{offset: 24, length: 48}]
      request:
        pcp: MAP
    map-success:
      protocol: pcp
      expect:
        version: 2
        opcode: MAP_RESPONSE
        result: [SUCCESS]
        length: 60
      request:
        pcp: MAP
    map-success-port-set-mapping-checked:
      protocol: pcp
      expect:
        version: 2
        opcode: MAP_RESPONSE
        result: [SUCCESS]
        length: 72
      verify: port-set-mapping
      assert:
        external: {nonzero: true, max: 65532}
      request:
        pcp: MAP
    map-udp-success-natpmp-mapping:
      protocol: natpmp
      expect:
        version: 0
        opcode: MAP_UDP_RESPONSE
        result: [SUCCESS]
        length: 16
      verify: natpmp-mapping
      request:
        natpmp: MAP_UDP
    map-success-checked:
      protocol: pcp
      expect:
        version: 2
        opcode: MAP_RESPONSE
        result: [SUCCESS]
        length: 60
      captures:
        internal_port: {offset: 40, type: u16}
        external_port: {offset: 42, type: u16}
      assert:
        internal_port: {equals: 51001}
        external_port: {nonzero: true}
      request:
        pcp: MAP
    map-success-port-set-mapping-checked-2:
      protocol: pcp
      expect:
        version: 2
        opcode: MAP_RESPONSE
        result: [SUCCESS]
        length: 72
      verify: port-set-mapping
      assert:
        external: {nonzero: true, max: 65534}
        size: {equals: 2}
      request:
        pcp: MAP
    map-tcp-success-natpmp-mapping:
      protocol: natpmp
      expect:
        version: 0
        opcode: MAP_TCP_RESPONSE
        result: [SUCCESS]
        length: 16
      verify: natpmp-mapping
      request:
        natpmp: MAP_TCP
    map-success-checked-2:
      protocol: pcp
      expect:
        version: 2
        opcode: MAP_RESPONSE
        result: [SUCCESS]
        length: 60
      captures:
        port: {offset: 42, type: u16}
      assert:
        port: {remember: assigned}
      request:
        pcp: MAP
    map-success-checked-3:
      protocol: pcp
      expect:
        version: 2
        opcode: MAP_RESPONSE
        result: [SUCCESS]
        length: 60
      captures:
        port: {offset: 42, type: u16}
      assert:
        port: {equals: $assigned}
      request:
        pcp: MAP
    map-malformed-option-echo:
      protocol: pcp
      expect:
        version: 2
        opcode: MAP_RESPONSE
        result: [MALFORMED_OPTION]
        length: 72
        echo_request: [{offset: 24, length: 48}]
      request:
        pcp: MAP
    map-malformed-option-echo-2:
      protocol: pcp
      expect:
        version: 2
        opcode: MAP_RESPONSE
        result: [MALFORMED_OPTION]
        length: 68
        echo_request: [{offset: 24, length: 44}]
      request:
        pcp: MAP
    map-success-port-set-mapping-checked-3:
      protocol: pcp
      expect:
        version: 2
        opcode: MAP_RESPONSE
        result: [SUCCESS]
        length: 72
      verify: port-set-mapping
      assert:
        external: {nonzero: true, max: 65534}
      request:
        pcp: MAP
    map-success-port-set-mapping-checked-4:
      protocol: pcp
      expect:
        version: 2
        opcode: MAP_RESPONSE
        result: [SUCCESS]
        length: 72
      verify: port-set-mapping
      assert:
        external: {nonzero: true, max: 65532, remember: set_external}
        external_address: {remember: set_address}
      request:
        pcp: MAP
    map-success-port-set-mapping-checked-5:
      protocol: pcp
      expect:
        version: 2
        opcode: MAP_RESPONSE
        result: [SUCCESS]
        length: 72
      verify: port-set-mapping
      assert:
        external: {nonzero: true, max: 65534, remember: partial_external}
        external_address: {remember: partial_address}
        size: {equals: 2}
      request:
        pcp: MAP
    map-success-port-set-mapping-checked-6:
      protocol: pcp
      expect:
        version: 2
        opcode: MAP_RESPONSE
        result: [SUCCESS]
        length: 72
      verify: port-set-mapping
      assert:
        external: {nonzero: true, max: 65534, equals: $partial_external}
        size: {equals: 2}
      request:
        pcp: MAP
# Sections document protocol scope; each case declares its request and expected behavior.
sections:
- title: 'RFC 6887 PCP: Base protocol and malformed packets'
  description: Header handling, core opcodes, error responses, address-family behavior, and malformed datagrams.
  cases:
  # RFC 6887 §7.1 (ANNOUNCE request and response).
  - name: announce-v2
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      header: ANNOUNCE
      client: source
    expect:
      kind: response
      length: 24
      version: 2
      opcode: ANNOUNCE_RESPONSE
      result: [SUCCESS, NETWORK_FAILURE]
    description: Send a PCP v2 ANNOUNCE and accept success or network failure depending on gateway state.
    # RFC 6887 §7.1 (version negotiation).
  - name: unsupported-version
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      header: ANNOUNCE
      version: 3
    expect:
      kind: response
      length: 24
      version: 2
      opcode: ANNOUNCE_RESPONSE
      result: [UNSUPP_VERSION]
    description: Send unsupported PCP version 3 and check the supported-version error response.
    # RFC 6887 §8.2 excerpt: “4 UNSUPP_OPCODE: Unsupported Opcode.”
  - name: unsupported-opcode-v2
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      header: 127
    expect:
      kind: response
      length: 24
      version: 2
      opcode: 255
      result: [UNSUPP_OPCODE]
    description: Send an unknown PCP v2 opcode and check UNSUPP_OPCODE.
    # RFC 6887 §7.1 (PCP common header).
  - name: short-header
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      kind: raw
      hex: '0200'
    expect:
      kind: silence
    description: Send a two-byte PCP datagram; the server should silently discard it.
    # RFC 6887 §§7.1, 8.2 (malformed requests).
  - name: minimum-short-header
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      header: ANNOUNCE
      truncate_to: 3
    expect:
      kind: response
      length: 24
      version: 2
      opcode: ANNOUNCE_RESPONSE
      result: [MALFORMED_REQUEST]
    description: Send a three-byte PCP header and check the malformed-request response.
    # RFC 6887 §7.1 (reserved common-header fields).
  - name: reserved-common-header
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      header: ANNOUNCE
      reserved: 65535
      client: source
    expect:
      kind: response
      length: 24
      version: 2
      opcode: ANNOUNCE_RESPONSE
      result: [SUCCESS, NETWORK_FAILURE]
    description: Set reserved common-header bits and check the server response.
    # RFC 6887 §7.1 (PCP common header).
  - name: truncated-common-header
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      header: ANNOUNCE
      truncate_to: 23
    expect:
      kind: response
      length: 24
      version: 2
      opcode: ANNOUNCE_RESPONSE
      result: [MALFORMED_REQUEST]
    description: Remove one byte from the common PCP header.
    # RFC 6887 §7.2 (MAP request format).
  - name: truncated-map-v1
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      header: MAP
      version: 1
    expect:
      kind: response
      length: 24
      version: 1
      opcode: MAP_RESPONSE
      result: [MALFORMED_REQUEST]
    description: Send a PCP v1 MAP request without its MAP body.
    # RFC 6887 §7.2 (MAP request format).
  - name: truncated-map-v2
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      header: MAP
    expect:
      kind: response
      length: 24
      version: 2
      opcode: MAP_RESPONSE
      result: [MALFORMED_REQUEST]
    description: Send a PCP v2 MAP request without its MAP body.
    # RFC 6887 §7.2: the v2 MAP body begins with a 96-bit Mapping Nonce.
  - name: truncated-map-nonce-four-bytes
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      pcp: MAP
      lifetime: 0
      nonce: 00112233445566778899aabb
      protocol: UDP
      internal_port: 40000
      truncate_to: 28
    expect:
      kind: response
      length: request
      version: 2
      opcode: MAP_RESPONSE
      result: [MALFORMED_REQUEST]
    description: Truncate a v2 MAP body after only four of the twelve nonce bytes.
    # RFC 6887 §§7.2, 11.3: incomplete MAP fields make the request malformed.
  - name: truncated-map-nonce-eight-bytes
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      pcp: MAP
      lifetime: 0
      nonce: 00112233445566778899aabb
      protocol: UDP
      internal_port: 40000
      truncate_to: 32
    expect:
      kind: response
      length: request
      version: 2
      opcode: MAP_RESPONSE
      result: [MALFORMED_REQUEST]
    description: Truncate a v2 MAP body after only eight of the twelve nonce bytes.
    # RFC 6887 §§7.2, 11.3: incomplete MAP fields make the request malformed.
    # RFC 6887 §7.1 (PCP packet length and padding).
  - name: misaligned-length
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      header: ANNOUNCE
      append_hex: '00'
    expect:
      kind: response
      length: 28
      version: 2
      opcode: ANNOUNCE_RESPONSE
      result: [MALFORMED_REQUEST]
    description: Append one byte to ANNOUNCE and verify error-response padding.
    # RFC 6887 §7.1 (maximum PCP message length).
  - name: oversized-packet
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      header: ANNOUNCE
      size: 1104
    expect:
      kind: response
      length: 1100
      version: 2
      opcode: ANNOUNCE_RESPONSE
      result: [MALFORMED_REQUEST]
    description: Send a datagram larger than PCP_MAX_LEN and check the capped error response.
    # RFC 6886 §3 (request and response opcode bit).
  - name: response-as-request
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      header: ANNOUNCE
      response_bit: true
    expect:
      kind: silence
    description: Set the response bit on a PCP packet and verify it is ignored.
    # RFC 6887 §11.1 (protocol and internal-port validation).
  - name: protocol-zero-nonzero-port
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      pcp: MAP
      lifetime: 0
      nonce: '424242424242424242424242'
      protocol_number: 0
      internal_port: 40000
      options: []
    expect:
      kind: response
      length: request
      version: 2
      opcode: MAP_RESPONSE
      result: [MALFORMED_REQUEST]
    description: Send a MAP request using IP protocol zero and check invalid-parameter handling.
    # RFC 6887 §11.1 (PREFER_FAILURE processing).
  - name: prefer-failure-address-mismatch
    protocol: pcp
    families: [ipv4]
    request:
      pcp: MAP
      lifetime: 3600
      nonce: '424242424242424242424242'
      protocol: UDP
      internal_port: 40000
      external_port: 41000
      external_address: 192.0.2.123
      options: [PREFER_FAILURE]
    expect:
      kind: response
      length: request
      version: 2
      opcode: MAP_RESPONSE
      result: [CANNOT_PROVIDE_EXTERNAL]
    description: Suggest a non-local external address with PREFER_FAILURE and check the mismatch error.
    # RFC 6887 §7.1 (client IP address field).
  - name: ipv6-source-address
    protocol: pcp
    families: [ipv6]
    request:
      pcp: MAP
      lifetime: 0
      nonce: '424242424242424242424242'
      protocol_number: 0
      internal_port: 40000
      options: []
    expect:
      kind: response
      length: request
      version: 2
      opcode: MAP_RESPONSE
      result: [MALFORMED_REQUEST]
    description: Send PCP over IPv6 using the actual IPv6 source address in the client field.
- title: 'RFC 6887 PCP: Unsolicited ANNOUNCE'
  description: Multicast restart announcements sent by the gateway on its own, which a request/response case cannot observe.
    The fixture restarts the daemon from a cold start and records outgoing traffic on every LAN and WAN interface.
  cases:
  # RFC 6887 §14.1.3: a restarting server sends a gratuitous ANNOUNCE "via paths over which it accepts PCP
  # requests" to 224.0.0.1:5350 and/or [ff02::1]:5350. Reading that as the LAN interfaces, the external
  # interface must stay silent (project expectation: a WAN announce leaks the gateway's restart upstream).
  - name: startup-announce-lan-only
    protocol: pcp
    families: [ipv4, ipv6]
    requires: [daemon-restart]
    request:
      kind: daemon_restart
    expect:
      kind: unsolicited_announce
      source_port: 5351
      destination_port: 5350
      destinations: {ipv4: 224.0.0.1, ipv6: 'ff02::1'}
      length: 24
      version: 2
      opcode: ANNOUNCE_RESPONSE
      result: [SUCCESS]
      lan: every
      wan: none
    description: After a daemon restart, send the multicast PCP ANNOUNCE on every LAN interface and never on the external
      interface.
  # RFC 6887 §14.1.3: the restart ANNOUNCE MAY be repeated up to ten times, "provided that the interval between
  # the first two notifications is at least 250 ms, and the interval between subsequent notification at least
  # doubles", with an Epoch Time that reflects the elapsed time. min_gap_ratio is 1.9 rather than 2 only to absorb
  # capture timestamp jitter. min_count 2 requires the daemon to actually repeat.
  - name: startup-announce-retransmission
    protocol: pcp
    families: [ipv4, ipv6]
    requires: [daemon-restart]
    request:
      kind: daemon_restart
    expect:
      kind: unsolicited_announce
      source_port: 5351
      destination_port: 5350
      destinations: {ipv4: 224.0.0.1, ipv6: 'ff02::1'}
      length: 24
      version: 2
      opcode: ANNOUNCE_RESPONSE
      result: [SUCCESS]
      lan: every
      wan: none
      min_count: 2
      max_count: 10
      min_first_gap_ms: 250
      min_gap_ratio: 1.9
    description: After a daemon restart, repeat the multicast ANNOUNCE on every LAN interface at most ten times, with the
      first gap at least 250 ms, each later gap at least doubling, and a nondecreasing Epoch Time that tracks the elapsed
      time.
- title: 'RFC 6887 PCP: Mapping Update (rapid recovery)'
  description: Unsolicited MAP responses a gateway sends on its own after it repairs its mappings, for example when the external
    address changes. Each case renumbers the external address through a fixture after the client has created the mapping,
    and records the packets the client receives (fixtures/docker.sh provides wan-renumber; without it these cases report
    SKIP). The known_failure records that miniupnpd does not implement the mechanism.
  cases:
  # RFC 6887 §14: a server MUST implement the ANNOUNCE Opcode or Mapping Update and SHOULD implement both.
  # miniupnpd implements only ANNOUNCE (see 'Unsolicited ANNOUNCE'); these cases cover the other mechanism.
  - name: mapping-update-after-wan-change
    protocol: pcp
    families: [ipv4]
    requires: [wan-renumber]
    known_failure: "miniupnpd does not implement PCP Mapping Update (RFC 6887 \xA714.2); after a WAN address change it only\
      \ multicasts an ANNOUNCE."
    request:
      kind: wan_renumber
      mapping:
        version: 2
        opcode: 1
        lifetime: 3600
        client: source
        nonce_hex: 5a5a5a5a5a5a5a5a5a5a5a5a
        protocol_number: 17
        internal_port: 40140
        external_port: 0
        external_address: '::'
    expect:
      kind: mapping_update
      source_port: 5351
      version: 2
      opcode: MAP_RESPONSE
      same_nonce: true
      same_internal_port: true
      destination: previous_response_source
      result: [SUCCESS]
      external_address: changed
    description: "RFC 6887 \xA714.2: after the external address changes, unicast an unsolicited MAP response to the client\
      \ address and port that received the prior response, with the new External IP Address and External Port."
  - name: mapping-update-three-transmissions
    protocol: pcp
    families: [ipv4]
    requires: [wan-renumber]
    known_failure: "miniupnpd does not implement PCP Mapping Update (RFC 6887 \xA714.2); after a WAN address change it only\
      \ multicasts an ANNOUNCE."
    request:
      kind: wan_renumber
      mapping:
        version: 2
        opcode: 1
        lifetime: 3600
        client: source
        nonce_hex: 5a5a5a5a5a5a5a5a5a5a5a5a
        protocol_number: 17
        internal_port: 40140
        external_port: 0
        external_address: '::'
    expect:
      kind: mapping_update
      source_port: 5351
      version: 2
      opcode: MAP_RESPONSE
      same_nonce: true
      same_internal_port: true
      destination: previous_response_source
      result: [SUCCESS]
      count: 3
      min_first_gap_ms: 250
      second_gap_ms: 500
      epoch_nondecreasing: true
    description: "RFC 6887 \xA714.2: send the update three times, the first gap at least 250 ms and the third packet after\
      \ a 500 ms interval, with an Epoch Time reflecting the elapsed time."
  - name: mapping-update-echoes-third-party
    protocol: pcp
    families: [ipv4]
    requires: [wan-renumber]
    known_failure: "miniupnpd does not implement PCP Mapping Update (RFC 6887 \xA714.2); after a WAN address change it only\
      \ multicasts an ANNOUNCE."
    request:
      kind: wan_renumber
      mapping:
        version: 2
        opcode: 1
        lifetime: 3600
        client: source
        nonce_hex: 5a5a5a5a5a5a5a5a5a5a5a5a
        protocol_number: 17
        internal_port: 40140
        external_port: 0
        external_address: '::'
      options:
      - {code: 1, data_hex: 00000000000000000000ffffc0000263}
    expect:
      kind: mapping_update
      source_port: 5351
      version: 2
      opcode: MAP_RESPONSE
      same_nonce: true
      same_internal_port: true
      destination: previous_response_source
      result: [SUCCESS]
      options_present:
      - {code: 1, data_hex: 00000000000000000000ffffc0000263}
    description: "RFC 6887 \xA714.2: if the original request carried THIRD_PARTY, the Mapping Update MUST carry the same THIRD_PARTY\
      \ option so the client can disambiguate it."
  - name: mapping-update-prefer-failure
    protocol: pcp
    families: [ipv4]
    requires: [wan-renumber]
    known_failure: "miniupnpd does not implement PCP Mapping Update (RFC 6887 \xA714.2); after a WAN address change it only\
      \ multicasts an ANNOUNCE."
    request:
      kind: wan_renumber
      mapping:
        version: 2
        opcode: 1
        lifetime: 3600
        client: source
        nonce_hex: 5a5a5a5a5a5a5a5a5a5a5a5a
        protocol_number: 17
        internal_port: 40140
        external_port: 0
        external_address: '::'
      options:
      - {code: 2}
    expect:
      kind: mapping_update
      source_port: 5351
      version: 2
      opcode: MAP_RESPONSE
      same_nonce: true
      same_internal_port: true
      destination: previous_response_source
      result: [CANNOT_PROVIDE_EXTERNAL]
    description: "RFC 6887 \xA714.2: a mapping created with PREFER_FAILURE whose external address and port cannot be kept\
      \ SHOULD be reported with CANNOT_PROVIDE_EXTERNAL."
  - name: mapping-update-omits-optional-options
    protocol: pcp
    families: [ipv4]
    requires: [wan-renumber]
    known_failure: "miniupnpd does not implement PCP Mapping Update (RFC 6887 \xA714.2); after a WAN address change it only\
      \ multicasts an ANNOUNCE."
    request:
      kind: wan_renumber
      mapping:
        version: 2
        opcode: 1
        lifetime: 3600
        client: source
        nonce_hex: 5a5a5a5a5a5a5a5a5a5a5a5a
        protocol_number: 17
        internal_port: 40140
        external_port: 0
        external_address: '::'
      options:
      - {code: 130, data_hex: 0001c73d00}
    expect:
      kind: mapping_update
      source_port: 5351
      version: 2
      opcode: MAP_RESPONSE
      same_nonce: true
      same_internal_port: true
      destination: previous_response_source
      result: [SUCCESS]
      options_absent: [130]
    description: "RFC 6887 \xA714.2: non-mandatory options from the original request SHOULD NOT appear in the Mapping Update."
  - name: mapping-update-stops-after-refresh
    protocol: pcp
    families: [ipv4]
    requires: [wan-renumber]
    known_failure: "miniupnpd does not implement PCP Mapping Update (RFC 6887 \xA714.2); after a WAN address change it only\
      \ multicasts an ANNOUNCE."
    request:
      kind: wan_renumber
      mapping:
        version: 2
        opcode: 1
        lifetime: 3600
        client: source
        nonce_hex: 5a5a5a5a5a5a5a5a5a5a5a5a
        protocol_number: 17
        internal_port: 40140
        external_port: 0
        external_address: '::'
      refresh_after_ms: 100
    expect:
      kind: mapping_update
      source_port: 5351
      version: 2
      opcode: MAP_RESPONSE
      same_nonce: true
      same_internal_port: true
      destination: previous_response_source
      result: [SUCCESS]
      max_count: 1
    description: "RFC 6887 \xA714.2: once the client has refreshed the mapping, the server SHOULD stop retransmitting the\
      \ update for it."
- title: 'RFC 6887 PCP: Options and extensions'
  description: Option parsing, duplicate handling, unknown options, and optional or mandatory extension behavior.
  cases:
  # RFC 6887 §8.2 excerpt: “handling this option is optional” when its high bit is set.
  - name: unknown-mandatory-option
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      pcp: MAP
      lifetime: 3600
      client: unspecified
      nonce: '424242424242424242424242'
      protocol: UDP
      internal_port: 40000
      options:
      - {code: 99}
    expect:
      kind: response
      length: request
      version: 2
      opcode: MAP_RESPONSE
      result: [UNSUPP_OPTION]
    description: Add an unknown mandatory option to MAP; expect unsupported-option handling.
    # RFC 6887 §8.2 (option processing and duplicate options).
  - name: duplicate-prefer-failure
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      pcp: MAP
      lifetime: 3600
      client: unspecified
      nonce: '424242424242424242424242'
      protocol: UDP
      internal_port: 40000
      options: [PREFER_FAILURE, PREFER_FAILURE]
    expect:
      kind: response
      length: request
      version: 2
      opcode: MAP_RESPONSE
      result: [MALFORMED_OPTION]
    description: Repeat PREFER_FAILURE and check the duplicate-option error.
    # RFC 6887 §8.2 (option processing and duplicate options).
  - name: duplicate-third-party
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      pcp: MAP
      lifetime: 3600
      client: unspecified
      nonce: '424242424242424242424242'
      protocol: UDP
      internal_port: 40000
      options:
      - {THIRD_PARTY: '00000000000000000000000000000000'}
      - {THIRD_PARTY: '00000000000000000000000000000000'}
    expect:
      kind: response
      length: request
      version: 2
      opcode: MAP_RESPONSE
      result: [MALFORMED_OPTION]
    description: Repeat THIRD_PARTY and check the duplicate-option error.
    # RFC 6887 §11.1 (PREFER_FAILURE option).
  - name: prefer-failure-without-suggestion
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      pcp: MAP
      lifetime: 3600
      nonce: '424242424242424242424242'
      protocol: UDP
      internal_port: 40000
      options: [PREFER_FAILURE]
    expect:
      kind: response
      length: request
      version: 2
      opcode: MAP_RESPONSE
      result: [MALFORMED_OPTION]
    description: Set PREFER_FAILURE without suggesting an external address or port.
    # RFC 6887 §13.2: with PREFER_FAILURE, an unavailable suggested port must not be substituted.
  - name: prefer-failure-port-unavailable
    protocol: pcp
    families: [ipv4]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request:
          pcp: MAP
          lifetime: 300
          nonce: '314159265358979323846264'
          protocol: UDP
          internal_port: 47201
          external_port: 48201
        expect:
          version: 2
          opcode: MAP_RESPONSE
          result: [SUCCESS]
          length: 60
        captures:
          external_port: {offset: 42, type: u16}
        assert:
          external_port: {equals: 48201}
      - protocol: pcp
        request:
          pcp: MAP
          lifetime: 300
          nonce: '271828182845904523536028'
          protocol: UDP
          internal_port: 47202
          external_port: 48201
          options: [PREFER_FAILURE]
        expect:
          version: 2
          opcode: MAP_RESPONSE
          result: [CANNOT_PROVIDE_EXTERNAL]
          length: request
      - protocol: pcp
        request:
          pcp: MAP
          lifetime: 300
          nonce: '314159265358979323846264'
          protocol: UDP
          internal_port: 47201
          external_port: 48201
        expect:
          version: 2
          opcode: MAP_RESPONSE
          result: [SUCCESS]
          length: 60
        captures:
          external_port: {offset: 42, type: u16}
        assert:
          external_port: {equals: 48201}
      cleanup:
      - use: map-success
        request:
          lifetime: 0
          nonce: '314159265358979323846264'
          protocol: UDP
          internal_port: 47201
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: Occupy a public UDP port, request it for another MAP with PREFER_FAILURE, require CANNOT_PROVIDE_EXTERNAL,
      and verify the first mapping remains intact.
    # RFC 6887 §11.1.2 (THIRD_PARTY authorization).
  - name: third-party-disabled
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      pcp: MAP
      lifetime: 3600
      nonce: '424242424242424242424242'
      protocol: UDP
      internal_port: 40000
      options:
      - {THIRD_PARTY: 20010db8000000000000000000000000}
    expect:
      kind: response
      length: request
      version: 2
      opcode: MAP_RESPONSE
      result: [UNSUPP_OPTION]
    description: Request THIRD_PARTY mapping while third-party requests are disabled.
    # RFC 6887 §8.5 (FILTER option format).
  - name: filter-wrong-length
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      pcp: MAP
      lifetime: 3600
      client: unspecified
      nonce: '424242424242424242424242'
      protocol: UDP
      internal_port: 40000
      options:
      - {FILTER: '00000000000000000000000000000000'}
    expect:
      kind: response
      length: request
      version: 2
      opcode: MAP_RESPONSE
      result: [MALFORMED_OPTION]
    description: Send a FILTER option with an invalid payload length.
    # RFC 6887 §8.2 (option length and packet bounds).
  - name: truncated-third-party-option
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      pcp: MAP
      lifetime: 3600
      client: unspecified
      nonce: '424242424242424242424242'
      protocol: UDP
      internal_port: 40000
      options:
      - {raw_hex: '01000010'}
    expect:
      kind: response
      length: request
      version: 2
      opcode: MAP_RESPONSE
      result: [MALFORMED_OPTION]
    description: Declare a THIRD_PARTY payload that is absent from the packet.
    # RFC 7220 §3 excerpt: “Support for the DESCRIPTION option by PCP servers and PCP clients is optional.”
  - name: description-extension-ignored
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      pcp: MAP
      lifetime: 3600
      client: unspecified
      nonce: '424242424242424242424242'
      protocol: UDP
      internal_port: 40000
      options:
      - {code: 128, data_hex: 6f646420636c69656e7420f09f8c90}
    expect:
      kind: response
      length: request
      version: 2
      opcode: MAP_RESPONSE
      result: [ADDRESS_MISMATCH]
    description: Send an RFC 7220 DESCRIPTION option with UTF-8 client text.
    # RFC 7220 §3 excerpt: “The server MUST then send the stored value back to the PCP client in the DESCRIPTION
    # option in the response.” A renewal with the option replaces the text, an empty option erases it.
  - name: description-echo-renew-clear
    requires: [lease-file]
    protocol: pcp
    families: [ipv4]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request: &descr-map
          pcp: MAP
          lifetime: 300
          nonce: d1d2d3d4d5d6d7d8d9dadbdc
          protocol: UDP
          internal_port: 52801
          external_port: 52801
          options:
          - {code: 128, data_hex: 43616d657261}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 72}
        captures:
          description: {offset: 60, type: hex, length: 12}
        assert:
          description: {equals: 8000000643616d6572610000}
      - kind: lease_file
        lines:
        - {kind: PCP-M, internal_port: 52801, nonce: d1d2d3d4d5d6d7d8d9dadbdc, label: Camera, count: 1}
      - protocol: pcp
        request:
          <<: *descr-map
          options: []
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
      - kind: lease_file
        lines:
        - {kind: PCP-M, internal_port: 52801, nonce: d1d2d3d4d5d6d7d8d9dadbdc, label: Camera, count: 1}
      - protocol: pcp
        request:
          <<: *descr-map
          options:
          - {code: 128, data_hex: 4b616d657261207374756520c3b8}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 80}
        captures:
          description: {offset: 60, type: hex, length: 20}
        assert:
          description: {equals: 8000000e4b616d657261207374756520c3b80000}
      - kind: lease_file
        lines:
        - {kind: PCP-M, internal_port: 52801, nonce: d1d2d3d4d5d6d7d8d9dadbdc, label: "Kamera stue \xF8", count: 1}
      - protocol: pcp
        request:
          <<: *descr-map
          options:
          - {code: 128}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 64}
        captures:
          description: {offset: 60, type: hex, length: 4}
        assert:
          description: {equals: '80000000'}
      - kind: lease_file
        lines:
        - {kind: PCP-M, internal_port: 52801, nonce: d1d2d3d4d5d6d7d8d9dadbdc, label: NA, count: 1}
      cleanup:
      - use: map-success
        request:
          lifetime: 0
          nonce: d1d2d3d4d5d6d7d8d9dadbdc
          protocol: UDP
          internal_port: 52801
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: A MAP DESCRIPTION is echoed and stored, kept by a renewal without it, replaced and then erased.
    # RFC 7220 §3 excerpt: “When the PCP server receives a DESCRIPTION option, it first stores the value of the
    # received Description field, truncating it if it cannot store the entire value.”
  - name: description-truncated
    protocol: pcp
    families: [ipv4]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request:
          pcp: MAP
          lifetime: 300
          nonce: d2d2d3d4d5d6d7d8d9dadbdc
          protocol: UDP
          internal_port: 52802
          external_port: 52802
          options:
          - {code: 128, data_hex: }
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 192}
        captures:
          description_header: {offset: 60, type: hex, length: 4}
        assert:
          description_header: {equals: 8000007f}
      cleanup:
      - use: map-success
        request:
          lifetime: 0
          nonce: d2d2d3d4d5d6d7d8d9dadbdc
          protocol: UDP
          internal_port: 52802
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: 127 ASCII octets and 40 two-octet characters are kept as the first 127 octets, not a split character.
    # RFC 7220 §3 excerpt: “If the PCP client request contains invalid DESCRIPTION options (e.g., the content is not
    # a legal UTF-8 string), the PCP server MUST ignore the request (i.e., MUST NOT return a DESCRIPTION option in
    # the response).”
  - name: description-invalid-utf8-ignored
    protocol: pcp
    families: [ipv4]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request:
          pcp: MAP
          lifetime: 300
          nonce: d3d2d3d4d5d6d7d8d9dadbdc
          protocol: UDP
          internal_port: 52803
          external_port: 52803
          options:
          - {code: 128, data_hex: 626164fffe}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
      cleanup:
      - use: map-success
        request:
          lifetime: 0
          nonce: d3d2d3d4d5d6d7d8d9dadbdc
          protocol: UDP
          internal_port: 52803
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: A DESCRIPTION that is not UTF-8 is ignored; the mapping is made and the response has no option.
    # RFC 7220 §2: “Maximum occurrences: 1”; RFC 6887 §7.3: an option over its maximum occurrences is MALFORMED_OPTION.
  - name: description-duplicate
    protocol: pcp
    families: [ipv4]
    request:
      pcp: MAP
      lifetime: 300
      nonce: d4d2d3d4d5d6d7d8d9dadbdc
      protocol: UDP
      internal_port: 52804
      external_port: 52804
      options:
      - {code: 128, data_hex: 6f6e65}
      - {code: 128, data_hex: 74776f}
    expect:
      kind: response
      length: request
      version: 2
      opcode: MAP_RESPONSE
      result: [MALFORMED_OPTION]
    description: Two DESCRIPTION options in one MAP request are MALFORMED_OPTION.
    # RFC 7220 §2: “Length: Variable, maximum 1016 octets.”
  - name: description-too-long
    protocol: pcp
    families: [ipv4]
    request:
      pcp: MAP
      lifetime: 300
      nonce: d5d2d3d4d5d6d7d8d9dadbdc
      protocol: UDP
      internal_port: 52805
      external_port: 52805
      options:
      - {code: 128, data_hex: '78', data_repeat: 1017}
    expect:
      kind: response
      length: request
      version: 2
      opcode: MAP_RESPONSE
      result: [MALFORMED_OPTION]
    description: A DESCRIPTION of 1017 octets is MALFORMED_OPTION.
    # RFC 7220 §2: “Valid for Opcodes: MAP, PEER”.
  - name: description-peer-echo
    requires: [pcp-peer, lease-file]
    protocol: pcp
    families: [ipv4]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request:
          pcp: PEER
          lifetime: 300
          nonce: d6d2d3d4d5d6d7d8d9dadbdc
          protocol: UDP
          internal_port: 52806
          external_port: 52806
          peer: 192.0.2.99
          peer_port: 443
          options:
          - {code: 128, data_hex: 43616d657261}
        expect: {version: 2, opcode: PEER_RESPONSE, result: [SUCCESS], length: 92}
        captures:
          description: {offset: 80, type: hex, length: 12}
        assert:
          description: {equals: 8000000643616d6572610000}
      - kind: lease_file
        lines:
        - {kind: PCP-P, internal_port: 52806, nonce: d6d2d3d4d5d6d7d8d9dadbdc, label: Camera, count: 1}
      cleanup:
      - protocol: pcp
        request:
          pcp: PEER
          lifetime: 0
          nonce: d6d2d3d4d5d6d7d8d9dadbdc
          protocol: UDP
          internal_port: 52806
          external_port: 52806
          peer: 192.0.2.99
          peer_port: 443
        expect: {version: 2, opcode: PEER_RESPONSE, result: [SUCCESS], length: 80}
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: A PEER DESCRIPTION is echoed and stored as the label of the PCP-P line.
    # RFC 7753 §4 excerpt: “PORT_SET option is in the optional-to-process range.”
  - name: port-set-extension-ignored
    known_failure: miniupnpd echoes unprocessed optional options in replies; response option omission is not implemented.
    protocol: pcp
    profiles:
    - baseline
    families: [ipv4, ipv6]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - use: map-success-checked
        request:
          lifetime: 300
          nonce: 112233445566778899aabbcc
          protocol: UDP
          internal_port: 51001
          external_port: 51001
          port_set: 1
      cleanup:
      - use: map-success
        request:
          lifetime: 0
          nonce: 112233445566778899aabbcc
          protocol: UDP
          internal_port: 51001
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: "RFC 7753 \xA74.2: a request for one port is handled as a single MAP; PORT_SET must be omitted from the response."
  - name: third-party-id-extension-unsupported
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      pcp: MAP
      lifetime: 3600
      client: unspecified
      nonce: '424242424242424242424242'
      protocol: UDP
      internal_port: 40000
      options:
      - {code: 13, data_hex: 7265616c6d}
    expect:
      kind: response
      length: request
      version: 2
      opcode: MAP_RESPONSE
      result: [UNSUPP_OPTION]
    description: Send the RFC 7843 THIRD_PARTY_ID option.
- title: 'RFC 6887 PCP: Mapping lifecycle'
  description: Mutating MAP and PEER create, renew, and delete flows; enabled with --mutating.
  cases:
  # RFC 6887 Appendix A and RFC 6886 §3.3 cover the PCP/NAT-PMP transition and mapping requests.
  - name: pcp-then-pmp-same-mapping-refused
    protocol: both
    families: [ipv4]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - use: map-success
        request:
          lifetime: 300
          nonce: 102030405060708090a0b0c0
          protocol: UDP
          internal_port: 47001
          external_port: 47001
      - protocol: natpmp
        request:
          natpmp: MAP_UDP
          private_port: 47001
          public_port: 47001
          lifetime: 300
          reserved: null
        expect:
          version: 0
          opcode: MAP_UDP_RESPONSE
          result: [NOT_AUTHORIZED]
          length: 16
      cleanup:
      - protocol: natpmp
        request:
          natpmp: MAP_UDP
          private_port: 47001
          public_port: 0
          lifetime: 0
          reserved: null
        expect:
          version: 0
          opcode: MAP_UDP_RESPONSE
          result: [SUCCESS]
          length: 16
      - use: map-success
        request:
          lifetime: 0
          nonce: 102030405060708090a0b0c0
          protocol: UDP
          internal_port: 47001
    expect:
      kind: lifecycle
      result: [2]
    description: Create a PCP-owned UDP mapping, then try to claim the exact tuple through NAT-PMP; the NAT-PMP operation
      is expected to fail.
  - name: pcp-then-pmp-port-conflict-preserves-pcp
    protocol: both
    families: [ipv4]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request:
          pcp: MAP
          lifetime: 300
          nonce: 2030405060708090a0b0c0d0
          protocol: UDP
          internal_port: 47101
          external_port: 48101
        expect:
          version: 2
          opcode: MAP_RESPONSE
          result: [SUCCESS]
          length: 60
        captures:
          nonce_word_1: {offset: 24, type: u32}
          nonce_word_2: {offset: 28, type: u32}
          nonce_word_3: {offset: 32, type: u32}
        assert:
          nonce_word_1: {equals: 540033104}
          nonce_word_2: {equals: 1617985680}
          nonce_word_3: {equals: 2695938256}
      - protocol: natpmp
        request:
          natpmp: MAP_UDP
          private_port: 47102
          public_port: 48101
          lifetime: 300
          reserved: null
        expect:
          version: 0
          opcode: MAP_UDP_RESPONSE
          result: [SUCCESS]
          length: 16
        captures:
          assigned_public_port: {offset: 10, type: u16}
        assert:
          assigned_public_port: {not_equals: 48101}
      - protocol: pcp
        request:
          pcp: MAP
          lifetime: 300
          nonce: 2030405060708090a0b0c0d0
          protocol: UDP
          internal_port: 47101
          external_port: 48101
        expect:
          version: 2
          opcode: MAP_RESPONSE
          result: [SUCCESS]
          length: 60
        captures:
          external_port: {offset: 42, type: u16}
        assert:
          external_port: {equals: 48101}
      cleanup:
      - protocol: natpmp
        request:
          natpmp: MAP_UDP
          private_port: 47102
          public_port: 0
          lifetime: 0
          reserved: null
        expect:
          version: 0
          opcode: MAP_UDP_RESPONSE
          result: [SUCCESS]
          length: 16
      - use: map-success
        request:
          lifetime: 0
          nonce: 2030405060708090a0b0c0d0
          protocol: UDP
          internal_port: 47101
    expect:
      kind: lifecycle
      result: [0]
    description: Keep a PCP mapping on a requested public port, make a conflicting PMP request for another private port, then
      verify PMP uses a different port and PCP still renews its original mapping.
    # RFC 6886 §3.3 says to choose another available external port when the requested port is unavailable.
    # RFC 6887 §11.3 requires a PCP mapping renewal to use its original Mapping Nonce.
    # RFC 6887 Appendix A describes the PCP/NAT-PMP transition.
    # RFC 6887 §11.1 (MAP lifetime and mapping state).
  - name: map-v1-lifecycle
    protocol: pcp
    families: [ipv4]
    mutating: true
    request:
      version: 1
      opcode: 1
      response_opcode: 129
      protocol_number: 17
      internal_port_base: 40000
      port_range: 20000
      response_length: 48
      nonce_length: 12
      nonce_offset: 24
      version_offset: 0
      opcode_offset: 1
      result_offset: 3
      kind: lifecycle
      operation: pcp_map
      captures:
        external_port: {offset: 30, type: u16}
        granted_lifetime: {offset: 4, type: u32}
      steps:
      - lifetime: 1
        external_port: 0
        assert:
          external_port: {nonzero: true, remember: assigned_port}
          granted_lifetime: {min: 120, max: 600}
      - lifetime: 4294967295
        external_port: $assigned_port
        assert:
          external_port: {equals: $assigned_port}
          granted_lifetime: {min: 1, max: 600}
      - lifetime: 300
        external_port: $assigned_port
        assert:
          external_port: {equals: $assigned_port}
          granted_lifetime: {min: 120, max: 300}
      - lifetime: 0
        external_port: $assigned_port
        assert:
          external_port: {equals: $assigned_port}
      cleanup:
        lifetime: 0
        external_port: $assigned_port
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: Create, renew with changed lifetimes, and delete a PCP v1 MAP.
    # RFC 6887 §11.1 (MAP nonce, lifetime, renewal, and deletion).
  - name: map-v2-lifecycle
    protocol: pcp
    families: [ipv4]
    mutating: true
    request:
      version: 2
      opcode: 1
      response_opcode: 129
      protocol_number: 17
      internal_port_base: 40000
      port_range: 20000
      response_length: 60
      nonce_length: 12
      nonce_offset: 24
      version_offset: 0
      opcode_offset: 1
      result_offset: 3
      kind: lifecycle
      operation: pcp_map
      captures:
        external_port: {offset: 42, type: u16}
        granted_lifetime: {offset: 4, type: u32}
      steps:
      - lifetime: 1
        external_port: 0
        assert:
          external_port: {nonzero: true, remember: assigned_port}
          granted_lifetime: {min: 120, max: 600}
        state: {line: M, mapping: present}
      - lifetime: 4294967295
        external_port: $assigned_port
        assert:
          external_port: {equals: $assigned_port}
          granted_lifetime: {min: 1, max: 600}
      - lifetime: 300
        external_port: $assigned_port
        assert:
          external_port: {equals: $assigned_port}
          granted_lifetime: {min: 120, max: 300}
      - lifetime: 0
        external_port: $assigned_port
        assert:
          external_port: {equals: $assigned_port}
        state: {line: M, mapping: absent}
      cleanup:
        lifetime: 0
        external_port: $assigned_port
    expect:
      kind: lifecycle
      result: [SUCCESS]
    description: Create, renew with changed lifetimes, and delete a PCP v2 MAP while checking its nonce.
    # RFC 6887 §11.3: the server copies the 96-bit Mapping Nonce into every MAP response.
  - name: map-v2-nonce-pattern-echo
    protocol: pcp
    families: [ipv4]
    mutating: true
    request:
      version: 2
      opcode: 1
      response_opcode: 129
      protocol_number: 17
      internal_port_base: 46000
      port_range: 10000
      response_length: 60
      nonce_length: 12
      nonce_offset: 24
      version_offset: 0
      opcode_offset: 1
      result_offset: 3
      kind: lifecycle
      operation: pcp_map
      captures:
        external_port: {offset: 42, type: u16}
        granted_lifetime: {offset: 4, type: u32}
      steps:
      - lifetime: 300
        internal_port: 46001
        external_port: 0
        nonce_hex: '000000000000000000000000'
        assert:
          external_port: {nonzero: true}
          granted_lifetime: {min: 120, max: 300}
      - lifetime: 300
        internal_port: 46002
        external_port: 0
        nonce_hex: ffffffffffffffffffffffff
        assert:
          external_port: {nonzero: true}
          granted_lifetime: {min: 120, max: 300}
      - lifetime: 300
        internal_port: 46003
        external_port: 0
        nonce_hex: 55aa55aa55aa55aa55aa55aa
        assert:
          external_port: {nonzero: true}
          granted_lifetime: {min: 120, max: 300}
      - lifetime: 300
        internal_port: 46004
        external_port: 0
        nonce_hex: '800000000000000000000001'
        assert:
          external_port: {nonzero: true}
          granted_lifetime: {min: 120, max: 300}
      cleanup:
      - lifetime: 0
        internal_port: 46001
        external_port: 0
        nonce_hex: '000000000000000000000000'
      - lifetime: 0
        internal_port: 46002
        external_port: 0
        nonce_hex: ffffffffffffffffffffffff
      - lifetime: 0
        internal_port: 46003
        external_port: 0
        nonce_hex: 55aa55aa55aa55aa55aa55aa
      - lifetime: 0
        internal_port: 46004
        external_port: 0
