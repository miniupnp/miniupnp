        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
        captures: {port: {offset: 42, type: u16}}
        assert: {port: {equals: 50151}}
      - protocol: pcp
        request: {pcp: MAP, lifetime: 300, nonce: '926926926926926926926927', protocol: TCP, internal_port: 50151}
        expect: {version: 2, opcode: MAP_RESPONSE, result: [SUCCESS], length: 60}
        captures: {port: {offset: 42, type: u16}}
        assert: {port: {equals: 50151}}
