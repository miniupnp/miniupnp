  # Coverage boundaries: NAT64, multiple external addresses, and independent LAN
  # clients need their own topology/policy fixtures. This WAN fixture provides
  # stateful IPv4 NAT / IPv6 firewall behavior with a single mapping owner.
- title: 'RFC 7753 PCP Extension for Port-Set Allocation: WAN traffic and isolation'
  description: Requires an explicit allocator profile and the WAN-peer fixture. Verify actual forwarding, boundaries,
    isolation and whole-set removal.
  cases:
  # RFC 7753 sections 4, 4.2-4.4 and 6.3; see the case description for the specific assertion.
  # Actual forwarding requires the explicit allocator profile and WAN actor.
  # Fresh source tuples avoid old conntrack state; check both the remote
  # echo result and actual LAN reception. This does not inspect all firewall objects.
  # Preflight uses plain single-port MAP: forward a real token, then block
  # a fresh tuple after deletion; it does not demonstrate set allocation.
  # Probe adjacent ports only when representable. Beyond 1..65535, omit
  # and log the negative probe explicitly instead of wrapping its port.
  - name: port-set-wan-fixture-udp
    protocol: pcp
    profiles:
    - port-set
    - port-set-limited
    families:
    - ipv4
    - ipv6
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request:
          kind: pcp_map
          version: 2
          opcode: 1
          lifetime: 300
          client: source
          nonce_hex: 112233445566778899aabbcc
          protocol_number: 17
          internal_port: 51101
          external_port: 0
          external_address: '::'
          options: []
        expect:
          version: 2
          opcode: 129
          result:
          - 0
          length: 60
        captures: *map_v2_fields
        assert:
          internal: {equals: 51101}
          external: {nonzero: true, max: 65535, remember: set_external}
          lifetime: {min: 1, max: 600}
          nonce: {equals: 112233445566778899aabbcc}
          protocol_reserved: {equals: 285212672}
          external_address: {remember: set_address}
      - kind: traffic_probe
        transport: udp
        internal_port: 51101
        external_address: $set_address
        external_port:
          add:
          - $set_external
          - 0
        expect: delivered
      - protocol: pcp
        request:
          kind: pcp_map
          version: 2
          opcode: 1
          lifetime: 0
          client: source
          nonce_hex: 112233445566778899aabbcc
          protocol_number: 17
          internal_port: 51101
          external_port: 0
          external_address: '::'
          options:
          - code: 130
            data_hex: 0001c79d00
        expect:
          version: 2
          opcode: 129
          result:
          - 0
          length:
          - 60
          - 72
        captures: *map_v2_fields
        assert:
          internal: {equals: 51101}
          lifetime: {equals: 0}
          nonce: {equals: 112233445566778899aabbcc}
          protocol_reserved: {equals: 285212672}
      - kind: traffic_probe
        transport: udp
        internal_port: 51101
        external_address: $set_address
        external_port:
          add:
          - $set_external
          - 0
        expect: blocked
        skip_unrepresentable_port: true
      cleanup:
      - protocol: pcp
        request:
          kind: pcp_map
          version: 2
          opcode: 1
          lifetime: 0
          client: source
          nonce_hex: 112233445566778899aabbcc
          protocol_number: 17
          internal_port: 51101
          external_port: 0
          external_address: '::'
          options:
          - code: 130
            data_hex: 0001c79d00
        expect:
          version: 2
          opcode: 129
          result:
          - 0
          length:
          - 60
          - 72
        captures: *map_v2_fields
        assert:
          internal: {equals: 51101}
          lifetime: {equals: 0}
          nonce: {equals: 112233445566778899aabbcc}
          protocol_reserved: {equals: 285212672}
    expect:
      kind: lifecycle
      result:
      - 0
