---
version: 1
profiles:
  baseline:
    description: Single-port fallback. PORT_SET payload semantics are not processed; invalid envelopes still fail.
  port-set:
    description: 'Explicit allocator fixture: fully grant sets through 16 ports, honor 120/300 second renewals and
      grant short requests at most 120 seconds, no quota exhaustion; IPv4/IPv6 TCP/UDP.'
  port-set-limited:
    description: 'Explicit allocator fixture: cap each new set at two ports and each client at four ports, with
      spare global resources and 120/300 second renewals; IPv4/IPv6 TCP/UDP.'
# Sections document protocol scope; each case declares its request and expected behavior.
sections:
- title: 'RFC 6887 PCP: Base protocol and malformed packets'
  description: Header handling, core opcodes, error responses, address-family behavior,
    and malformed datagrams.
  cases:
  # RFC 6887 §7.1 (ANNOUNCE request and response).
  - name: announce-v2
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_header
      version: 2
      opcode: 0
      client: source
    expect:
      kind: response
      length: 24
      version: 2
      opcode: 128
      result:
      - 0
      - 7
    description: Send a PCP v2 ANNOUNCE and accept success or network failure depending
      on gateway state.
    # RFC 6887 §7.1 (version negotiation).
  - name: unsupported-version
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_header
      version: 3
      opcode: 0
    expect:
      kind: response
      length: 24
      version: 2
      opcode: 128
      result:
      - 1
    description: Send unsupported PCP version 3 and check the supported-version error
      response.
    # RFC 6887 §8.2 excerpt: “4 UNSUPP_OPCODE: Unsupported Opcode.”
  - name: unsupported-opcode-v2
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_header
      version: 2
      opcode: 127
    expect:
      kind: response
      length: 24
      version: 2
      opcode: 255
      result:
      - 4
    description: Send an unknown PCP v2 opcode and check UNSUPP_OPCODE.
    # RFC 6887 §7.1 (PCP common header).
  - name: short-header
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: raw
      hex: '0200'
    expect:
      kind: silence
    description: Send a two-byte PCP datagram; the server should silently discard
      it.
    # RFC 6887 §§7.1, 8.2 (malformed requests).
  - name: minimum-short-header
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_header
      version: 2
      opcode: 0
      truncate_to: 3
    expect:
      kind: response
      length: 24
      version: 2
      opcode: 128
      result:
      - 3
    description: Send a three-byte PCP header and check the malformed-request response.
    # RFC 6887 §7.1 (reserved common-header fields).
  - name: reserved-common-header
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_header
      version: 2
      opcode: 0
      reserved: 65535
    expect:
      kind: response
      length: 24
      version: 2
      opcode: 128
      result:
      - 0
      - 7
    description: Set reserved common-header bits and check the server response.
    # RFC 6887 §7.1 (PCP common header).
  - name: truncated-common-header
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_header
      version: 2
      opcode: 0
      truncate_to: 23
    expect:
      kind: response
      length: 24
      version: 2
      opcode: 128
      result:
      - 3
    description: Remove one byte from the common PCP header.
    # RFC 6887 §7.2 (MAP request format).
  - name: truncated-map-v1
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_header
      version: 1
      opcode: 1
    expect:
      kind: response
      length: 24
      version: 1
      opcode: 129
      result:
      - 3
    description: Send a PCP v1 MAP request without its MAP body.
    # RFC 6887 §7.2 (MAP request format).
  - name: truncated-map-v2
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_header
      version: 2
      opcode: 1
    expect:
      kind: response
      length: 24
      version: 2
      opcode: 129
      result:
      - 3
    description: Send a PCP v2 MAP request without its MAP body.
    # RFC 6887 §7.2: the v2 MAP body begins with a 96-bit Mapping Nonce.
  - name: truncated-map-nonce-four-bytes
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      kind: pcp_map
      version: 2
      opcode: 1
      lifetime: 0
      client: source
      nonce_hex: '00112233445566778899aabb'
      protocol_number: 17
      internal_port: 40000
      external_port: 0
      external_address: '::'
      truncate_to: 28
    expect:
      kind: response
      length: request
      version: 2
      opcode: 129
      result: [3]
    description: Truncate a v2 MAP body after only four of the twelve nonce bytes.
    # RFC 6887 §§7.2, 11.3: incomplete MAP fields make the request malformed.
  - name: truncated-map-nonce-eight-bytes
    protocol: pcp
    families: [ipv4, ipv6]
    request:
      kind: pcp_map
      version: 2
      opcode: 1
      lifetime: 0
      client: source
      nonce_hex: '00112233445566778899aabb'
      protocol_number: 17
      internal_port: 40000
      external_port: 0
      external_address: '::'
      truncate_to: 32
    expect:
      kind: response
      length: request
      version: 2
      opcode: 129
      result: [3]
    description: Truncate a v2 MAP body after only eight of the twelve nonce bytes.
    # RFC 6887 §§7.2, 11.3: incomplete MAP fields make the request malformed.
    # RFC 6887 §7.1 (PCP packet length and padding).
  - name: misaligned-length
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_header
      version: 2
      opcode: 0
      append_hex: '00'
    expect:
      kind: response
      length: 28
      version: 2
      opcode: 128
      result:
      - 3
    description: Append one byte to ANNOUNCE and verify error-response padding.
    # RFC 6887 §7.1 (maximum PCP message length).
  - name: oversized-packet
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_header
      version: 2
      opcode: 0
      size: 1104
    expect:
      kind: response
      length: 1100
      version: 2
      opcode: 128
      result:
      - 3
    description: Send a datagram larger than PCP_MAX_LEN and check the capped error
      response.
    # RFC 6887 §7.1 (Request/Response bit).
  - name: response-as-request
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_header
      version: 2
      opcode: 0
      response_bit: true
    expect:
      kind: silence
    description: Set the response bit on a PCP packet and verify it is ignored.
    # RFC 6887 §11.1 (protocol and internal-port validation).
  - name: protocol-zero-nonzero-port
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_map
      version: 2
      opcode: 1
      lifetime: 0
      client: source
      nonce_hex: '424242424242424242424242'
      protocol_number: 0
      internal_port: 40000
      external_port: 0
      external_address: '::'
      options: []
    expect:
      kind: response
      length: request
      version: 2
      opcode: 129
      result:
      - 3
    description: Send a MAP request using IP protocol zero and check invalid-parameter
      handling.
    # RFC 6887 §11.1 (PREFER_FAILURE processing).
  - name: prefer-failure-address-mismatch
    protocol: pcp
    families:
    - ipv4
    request:
      kind: pcp_map
      version: 2
      opcode: 1
      lifetime: 3600
      client: source
      nonce_hex: '424242424242424242424242'
      protocol_number: 17
      internal_port: 40000
      external_port: 41000
      external_address: 192.0.2.123
      options:
      - code: 2
    expect:
      kind: response
      length: request
      version: 2
      opcode: 129
      result:
      - 11
    description: Suggest a non-local external address with PREFER_FAILURE and check
      the mismatch error.
    # RFC 6887 §7.1 (client IP address field).
  - name: ipv6-source-address
    protocol: pcp
    families:
    - ipv6
    request:
      kind: pcp_map
      version: 2
      opcode: 1
      lifetime: 0
      client: source
      nonce_hex: '424242424242424242424242'
      protocol_number: 0
      internal_port: 40000
      external_port: 0
      external_address: '::'
      options: []
    expect:
      kind: response
      length: request
      version: 2
      opcode: 129
      result:
      - 3
    description: Send PCP over IPv6 using the actual IPv6 source address in the client
      field.
- title: 'RFC 6887 PCP: Options and extensions'
  description: Option parsing, duplicate handling, unknown options, and optional or
    mandatory extension behavior.
  cases:
  # RFC 6887 §8.2 excerpt: “handling this option is optional” when its high bit is set.
  - name: unknown-mandatory-option
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_map
      version: 2
      opcode: 1
      lifetime: 3600
      client: unspecified
      nonce_hex: '424242424242424242424242'
      protocol_number: 17
      internal_port: 40000
      external_port: 0
      external_address: '::'
      options:
      - code: 99
    expect:
      kind: response
      length: request
      version: 2
      opcode: 129
      result:
      - 5
    description: Add an unknown mandatory option to MAP; expect unsupported-option
      handling.
    # RFC 6887 §8.2 (option processing and duplicate options).
  - name: duplicate-prefer-failure
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_map
      version: 2
      opcode: 1
      lifetime: 3600
      client: unspecified
      nonce_hex: '424242424242424242424242'
      protocol_number: 17
      internal_port: 40000
      external_port: 0
      external_address: '::'
      options:
      - code: 2
      - code: 2
    expect:
      kind: response
      length: request
      version: 2
      opcode: 129
      result:
      - 6
    description: Repeat PREFER_FAILURE and check the duplicate-option error.
    # RFC 6887 §8.2 (option processing and duplicate options).
  - name: duplicate-third-party
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_map
      version: 2
      opcode: 1
      lifetime: 3600
      client: unspecified
      nonce_hex: '424242424242424242424242'
      protocol_number: 17
      internal_port: 40000
      external_port: 0
      external_address: '::'
      options:
      - code: 1
        data_hex: '00000000000000000000000000000000'
      - code: 1
        data_hex: '00000000000000000000000000000000'
    expect:
      kind: response
      length: request
      version: 2
      opcode: 129
      result:
      - 6
    description: Repeat THIRD_PARTY and check the duplicate-option error.
    # RFC 6887 §11.1 (PREFER_FAILURE option).
  - name: prefer-failure-without-suggestion
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_map
      version: 2
      opcode: 1
      lifetime: 3600
      client: source
      nonce_hex: '424242424242424242424242'
      protocol_number: 17
      internal_port: 40000
      external_port: 0
      external_address: '::'
      options:
      - code: 2
    expect:
      kind: response
      length: request
      version: 2
      opcode: 129
      result:
      - 6
    description: Set PREFER_FAILURE without suggesting an external address or port.
    # RFC 6887 §13.2: with PREFER_FAILURE, an unavailable suggested port must not be substituted.
  - name: prefer-failure-port-unavailable
    protocol: pcp
    families: [ipv4]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request:
          kind: pcp_map
          version: 2
          opcode: 1
          lifetime: 300
          client: source
          nonce_hex: '314159265358979323846264'
          protocol_number: 17
          internal_port: 47201
          external_port: 48201
          external_address: '::'
        expect: {version: 2, opcode: 129, result: [0], length: 60}
        captures:
          external_port: {offset: 42, type: u16}
        assert:
          external_port: {equals: 48201}
      - protocol: pcp
        request:
          kind: pcp_map
          version: 2
          opcode: 1
          lifetime: 300
          client: source
          nonce_hex: '271828182845904523536028'
          protocol_number: 17
          internal_port: 47202
          external_port: 48201
          external_address: '::'
          options: [{code: 2}]
        expect: {version: 2, opcode: 129, result: [11], length: request}
      - protocol: pcp
        request:
          kind: pcp_map
          version: 2
          opcode: 1
          lifetime: 300
          client: source
          nonce_hex: '314159265358979323846264'
          protocol_number: 17
          internal_port: 47201
          external_port: 48201
          external_address: '::'
        expect: {version: 2, opcode: 129, result: [0], length: 60}
        captures:
          external_port: {offset: 42, type: u16}
        assert:
          external_port: {equals: 48201}
      cleanup:
      - protocol: pcp
        request:
          kind: pcp_map
          version: 2
          opcode: 1
          lifetime: 0
          client: source
          nonce_hex: '314159265358979323846264'
          protocol_number: 17
          internal_port: 47201
          external_port: 0
          external_address: '::'
        expect: {version: 2, opcode: 129, result: [0], length: 60}
    expect: {kind: lifecycle, result: [0]}
    description: Occupy a public UDP port, request it for another MAP with PREFER_FAILURE, require
      CANNOT_PROVIDE_EXTERNAL, and verify the first mapping remains intact.
    # RFC 6887 §11.1.2 (THIRD_PARTY authorization).
  - name: third-party-disabled
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_map
      version: 2
      opcode: 1
      lifetime: 3600
      client: source
      nonce_hex: '424242424242424242424242'
      protocol_number: 17
      internal_port: 40000
      external_port: 0
      external_address: '::'
      options:
      - code: 1
        data_hex: 20010db8000000000000000000000000
    expect:
      kind: response
      length: request
      version: 2
      opcode: 129
      result:
      - 5
    description: Request THIRD_PARTY mapping while third-party requests are disabled.
    # RFC 6887 §8.5 (FILTER option format).
  - name: filter-wrong-length
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_map
      version: 2
      opcode: 1
      lifetime: 3600
      client: unspecified
      nonce_hex: '424242424242424242424242'
      protocol_number: 17
      internal_port: 40000
      external_port: 0
      external_address: '::'
      options:
      - code: 3
        data_hex: '00000000000000000000000000000000'
    expect:
      kind: response
      length: request
      version: 2
      opcode: 129
      result:
      - 6
    description: Send a FILTER option with an invalid payload length.
    # RFC 6887 §8.2 (option length and packet bounds).
  - name: truncated-third-party-option
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_map
      version: 2
      opcode: 1
      lifetime: 3600
      client: unspecified
      nonce_hex: '424242424242424242424242'
      protocol_number: 17
      internal_port: 40000
      external_port: 0
      external_address: '::'
      options:
      - raw_hex: '01000010'
    expect:
      kind: response
      length: request
      version: 2
      opcode: 129
      result:
      - 6
    description: Declare a THIRD_PARTY payload that is absent from the packet.
    # RFC 7220 §3 excerpt: “Support for the DESCRIPTION option by PCP servers and PCP clients is optional.”
  - name: description-extension-ignored
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_map
      version: 2
      opcode: 1
      lifetime: 3600
      client: unspecified
      nonce_hex: '424242424242424242424242'
      protocol_number: 17
      internal_port: 40000
      external_port: 0
      external_address: '::'
      options:
      - code: 128
        data_hex: 6f646420636c69656e7420f09f8c90
    expect:
      kind: response
      length: request
      version: 2
      opcode: 129
      result:
      - 12
    description: Send an RFC 7220 DESCRIPTION option with UTF-8 client text.
    # RFC 7753 §4 excerpt: “PORT_SET option is in the optional-to-process range.”
  - name: port-set-extension-ignored
    known_failure: miniupnpd echoes unprocessed optional options in replies; response option omission is not implemented.
    protocol: pcp
    profiles: [baseline]
    families:
    - ipv4
    - ipv6
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request:
          kind: pcp_map
          version: 2
          opcode: 1
          lifetime: 300
          client: source
          nonce_hex: 112233445566778899aabbcc
          protocol_number: 17
          internal_port: 51001
          external_port: 51001
          external_address: '::'
          options:
          - code: 130
            data_hex: 0001c73900
        expect:
          version: 2
          opcode: 129
          result:
          - 0
          length: 60
        captures:
          internal_port:
            offset: 40
            type: u16
          external_port:
            offset: 42
            type: u16
        assert:
          internal_port:
            equals: 51001
          external_port:
            nonzero: true
      cleanup:
      - protocol: pcp
        request:
          kind: pcp_map
          version: 2
          opcode: 1
          lifetime: 0
          client: source
          nonce_hex: 112233445566778899aabbcc
          protocol_number: 17
          internal_port: 51001
          external_port: 0
          external_address: '::'
        expect:
          version: 2
          opcode: 129
          result:
          - 0
          length: 60
    expect:
      kind: lifecycle
      result:
      - 0
    description: 'RFC 7753 §4.2: a request for one port is handled as a single MAP; PORT_SET must be omitted from
      the response.'
  - name: third-party-id-extension-unsupported
    protocol: pcp
    families:
    - ipv4
    - ipv6
    request:
      kind: pcp_map
      version: 2
      opcode: 1
      lifetime: 3600
      client: unspecified
      nonce_hex: '424242424242424242424242'
      protocol_number: 17
      internal_port: 40000
      external_port: 0
      external_address: '::'
      options:
      - code: 13
        data_hex: 7265616c6d
    expect:
      kind: response
      length: request
      version: 2
      opcode: 129
      result:
      - 5
    description: Send the RFC 7843 THIRD_PARTY_ID option.
- title: 'RFC 6887 PCP: Mapping lifecycle'
  description: Mutating MAP and PEER create, renew, and delete flows; enabled with
    --mutating.
  cases:
  # RFC 6887 Appendix A and RFC 6886 §3.3 cover the PCP/NAT-PMP transition and mapping requests.
  - name: pcp-then-pmp-same-mapping-refused
    protocol: both
    families: [ipv4]
    mutating: true
    known_failure: Current backend allows NAT-PMP to replace a PCP-owned mapping with the same tuple; this case requires
      the PMP attempt to be refused.
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request:
          kind: pcp_map
          version: 2
          opcode: 1
          lifetime: 300
          client: source
          nonce_hex: '102030405060708090a0b0c0'
          protocol_number: 17
          internal_port: 47001
          external_port: 47001
          external_address: '::'
        expect:
          version: 2
          opcode: 129
          result: [0]
          length: 60
      - protocol: natpmp
        request:
          kind: natpmp
          version: 0
          opcode: 1
          private_port: 47001
          public_port: 47001
          lifetime: 300
        expect:
          version: 0
          opcode: 129
          result: [2]
          length: 16
      cleanup:
      - protocol: natpmp
        request: {kind: natpmp, version: 0, opcode: 1, private_port: 47001, public_port: 0, lifetime: 0}
        expect: {version: 0, opcode: 129, result: [0], length: 16}
      - protocol: pcp
        request:
          kind: pcp_map
          version: 2
          opcode: 1
          lifetime: 0
          client: source
          nonce_hex: '102030405060708090a0b0c0'
          protocol_number: 17
          internal_port: 47001
          external_port: 0
          external_address: '::'
        expect: {version: 2, opcode: 129, result: [0], length: 60}
    expect: {kind: lifecycle, result: [2]}
    description: Create a PCP-owned UDP mapping, then try to claim the exact tuple through NAT-PMP; the NAT-PMP
      operation is expected to fail.
  - name: pcp-then-pmp-port-conflict-preserves-pcp
    protocol: both
    families: [ipv4]
    mutating: true
    request:
      kind: protocol_sequence
      steps:
      - protocol: pcp
        request:
          kind: pcp_map
          version: 2
          opcode: 1
          lifetime: 300
          client: source
          nonce_hex: '2030405060708090a0b0c0d0'
          protocol_number: 17
          internal_port: 47101
          external_port: 48101
          external_address: '::'
        expect: {version: 2, opcode: 129, result: [0], length: 60}
        captures:
          nonce_word_1: {offset: 24, type: u32}
          nonce_word_2: {offset: 28, type: u32}
          nonce_word_3: {offset: 32, type: u32}
        assert:
          nonce_word_1: {equals: 540033104}
          nonce_word_2: {equals: 1617985680}
          nonce_word_3: {equals: 2695938256}
      - protocol: natpmp
        request:
          kind: natpmp
          version: 0
          opcode: 1
          private_port: 47102
          public_port: 48101
          lifetime: 300
        expect: {version: 0, opcode: 129, result: [0], length: 16}
        captures:
          assigned_public_port: {offset: 10, type: u16}
        assert:
          assigned_public_port: {not_equals: 48101}
      - protocol: pcp
        request:
          kind: pcp_map
          version: 2
          opcode: 1
          lifetime: 300
          client: source
          nonce_hex: '2030405060708090a0b0c0d0'
          protocol_number: 17
          internal_port: 47101
          external_port: 48101
          external_address: '::'
        expect: {version: 2, opcode: 129, result: [0], length: 60}
        captures:
          external_port: {offset: 42, type: u16}
        assert:
          external_port: {equals: 48101}
      cleanup:
      - protocol: natpmp
        request: {kind: natpmp, version: 0, opcode: 1, private_port: 47102, public_port: 0, lifetime: 0}
        expect: {version: 0, opcode: 129, result: [0], length: 16}
      - protocol: pcp
        request:
          kind: pcp_map
          version: 2
          opcode: 1
          lifetime: 0
          client: source
          nonce_hex: '2030405060708090a0b0c0d0'
          protocol_number: 17
          internal_port: 47101
          external_port: 0
          external_address: '::'
        expect: {version: 2, opcode: 129, result: [0], length: 60}
    expect: {kind: lifecycle, result: [0]}
